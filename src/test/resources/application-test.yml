# ===== 测试环境配置 =====
# 所有测试通过 @ActiveProfiles("test") 激活此 profile
spring:
  main:
    allow-circular-references: true
  thymeleaf:
    cache: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-test.sql
  datasource:
    url: "jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=0;DATABASE_TO_LOWER=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  data:
    redis:
      host: localhost
      port: 16379      # 不存在的端口，防止误连 Redis
      timeout: 200ms
  cache:
    type: none         # 禁用缓存，避免跨测试污染

wecom:
  corp-id: test_corp_id
  corp-secret: test_secret
  callback-token: test-token
  callback-encoding-aes-key: test-aes-key-0000000000000000000000000000000

app:
  admin:
    default-username: admin
    default-password: ""          # 空密码跳过自动创建 admin，测试中手动播种
  font:
    resource-path: ""                     # 空字符串=禁用 classpath 字体，使用系统降级
  qr-image:
    font-name: SansSerif
  worker:
    callback:
      threads: 0                  # 阻止 CallbackWorker @PostConstruct 启动消费线程
    tag:
      threads: 0                  # 阻止 TagWorker 启动
      delay-ms: 0
    datafill:
      threads: 0                  # 阻止 DataFillWorker 启动
    outbound:
      threads: 0                  # 阻止 OutboundMsgWorker 启动
    transfer:
      threads: 0                  # 阻止 TransferWorker 启动
  redis-stream:
    callback-maxlen: 10000
    tag-maxlen: 10000
    datafill-maxlen: 10000
    dlq-maxlen: 10000
  wecom:
    root-department-id: 1
    connect-timeout: 3
    read-timeout: 10
  agent:
    daily-max-default: 150
    batch-import-daily-max: 200
    rotation-lock-ttl-seconds: 60
  transfer:
    form-url: http://localhost:8080/form
  base-url: http://localhost:8080
  school-entry-url: http://localhost:8080/s
  school-rate-limit:
    max-per-minute: 30
    window-seconds: 60
