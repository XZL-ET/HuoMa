# 应用配置
spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true   # 允许自注入（AgentBindService 通过 self 代理引用调用 @Async/@Transactional）
  thymeleaf:
    cache: false                    # 开发环境禁用模板缓存（实时刷新）
    prefix: classpath:/templates/   # 模板文件路径前缀
  jpa:
    hibernate:
      ddl-auto: none      # 禁用 Hibernate 自动建表，统一由 schema.sql 管理
    show-sql: false       # 关闭 SQL 日志输出
  sql:
    init:
      mode: always                        # 每次启动执行初始化脚本
      schema-locations: classpath:schema.sql  # 建表 DDL 脚本路径
  transaction:
    default-timeout: 30s    # 全局事务超时，防止 DB 连接被长期占用

server:
  port: 8080                    # HTTP 监听端口
  undertow:
    threads:
      worker: 20                # 限制 Undertow Worker 线程数，预留连接给异步任务池

# Actuator 健康检查（供 K8s 探针 / 负载均衡器使用）
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true

# ===== 应用配置 =====
app:
  admin:
    default-username: admin
    default-password: ${ADMIN_DEFAULT_PASSWORD:admin123}

---
spring:
  config:
    activate:
      on-profile: dev
  # ===== 数据源 =====
  datasource:
    url: jdbc:mysql://localhost:3306/bookstore_qrcode?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai  # MySQL JDBC 连接串（开发环境）
    username: root                                                                # 数据库用户名
    password: ${DB_PASSWORD:<YOUR_MYSQL_ROOT_PASSWORD>}                                            # 数据库密码（默认值仅用于开发）
    hikari:
      maximum-pool-size: 30          # 连接池上限
      minimum-idle: 4                # 最少空闲连接
      connection-timeout: 5000       # 获取连接超时 5s
      idle-timeout: 600000           # 空闲回收 10min
      max-lifetime: 1800000          # 最大存活 30min
  # ===== Redis =====
  data:
    redis:
      host: localhost                   # Redis 主机地址
      port: 6379                        # Redis 端口
      timeout: 15s                      # Redis 命令超时（需 > XREADGROUP 最大 block 时长 10s）

# ===== 企业微信 =====
wecom:
  corp-id: ${WECOM_CORP_ID:ww36b412d53f0fe0c6}                          # 企业微信 CorpID
  corp-secret: ${WECOM_CORP_SECRET:<YOUR_WECOM_CORP_SECRET>}  # 企业微信应用 Secret
  callback-token: ${WECOM_CALLBACK_TOKEN:<YOUR_WECOM_CALLBACK_TOKEN>}             # 回调 URL 验证 Token
  callback-encoding-aes-key: ${WECOM_CALLBACK_AES_KEY:<YOUR_WECOM_AES_KEY>}  # 回调消息 AES 密钥

---
spring:
  config:
    activate:
      on-profile: prod
  # ===== 数据源 =====
  datasource:
    url: jdbc:mysql://localhost:3306/bookstore_qrcode?useSSL=true&serverTimezone=Asia/Shanghai  # MySQL JDBC 连接串（生产环境，启用 SSL）
    username: ${DB_USERNAME:bookstore}              # 数据库用户名（环境变量注入）
    password: ${DB_PASSWORD:<YOUR_DB_PASSWORD>}  # 数据库密码（环境变量注入）
    hikari:
      maximum-pool-size: 50          # 连接池上限（≥ Worker+Undertow 总线程数 42）
      minimum-idle: 8                # 最少空闲连接
      connection-timeout: 5000       # 获取连接超时 5s
      idle-timeout: 600000           # 空闲回收 10min
      max-lifetime: 1800000          # 最大存活 30min
  thymeleaf:
    cache: true                                    # 生产环境启用模板缓存以提升性能
  jpa:
    show-sql: false                                # 生产环境关闭 SQL 日志
  # ===== Redis =====
  data:
    redis:
      host: localhost                   # Redis 主机地址
      port: 6379                        # Redis 端口
      password: ${REDIS_PASSWORD:}                  # Redis 密码（生产环境必填）
      timeout: 15s                      # Redis 命令超时（需 > XREADGROUP 最大 block 时长 10s）

# ===== 企业微信 =====
wecom:
  corp-id: ${WECOM_CORP_ID}                              # 企业微信 CorpID（环境变量注入）
  corp-secret: ${WECOM_CORP_SECRET}                      # 企业微信应用 Secret（环境变量注入）
  callback-token: ${WECOM_CALLBACK_TOKEN}                # 回调 URL 验证 Token（环境变量注入）
  callback-encoding-aes-key: ${WECOM_CALLBACK_AES_KEY}   # 回调消息 AES 密钥（环境变量注入）
