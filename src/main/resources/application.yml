# 应用配置
spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true   # 允许自注入（DailyResetWorker/PatrolWorker 通过 self 代理引用调用 @Transactional）
  thymeleaf:
    cache: false                    # 开发环境禁用模板缓存（实时刷新）
    prefix: classpath:/templates/   # 模板文件路径前缀
  jpa:
    hibernate:
      ddl-auto: none      # 禁用 Hibernate 自动建表，统一由 schema.sql 管理
    show-sql: false       # 关闭 SQL 日志输出
  sql:
    init:
      mode: always                        # 每次启动执行初始化脚本
      schema-locations: classpath:schema.sql  # 建表 DDL 脚本路径
  transaction:
    default-timeout: 30s    # 全局事务超时，防止 DB 连接被长期占用

server:
  port: 8080                    # HTTP 监听端口
  undertow:
    threads:
      worker: ${UNDERTOW_WORKER_THREADS:20}                # 限制 Undertow Worker 线程数，预留连接给异步任务池

# Actuator 健康检查（供 K8s 探针 / 负载均衡器使用）
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true

# ===== 应用业务配置 =====
app:
  admin:
    default-username: ${ADMIN_DEFAULT_USERNAME:admin}
    default-password: ${ADMIN_DEFAULT_PASSWORD:}   # 生产必设，空则跳过自建
  qr-image:
    font-name: ${QR_FONT_NAME:SansSerif}            # Linux 兼容默认字体
  worker:
    callback:
      threads: ${CALLBACK_THREADS:4}
    tag:
      threads: ${TAG_THREADS:8}
      delay-ms: ${TAG_DELAY_MS:50}
    datafill:
      threads: ${DATAFILL_THREADS:4}
  redis-stream:
    callback-maxlen: ${CALLBACK_STREAM_MAXLEN:50000}
    tag-maxlen: ${TAG_STREAM_MAXLEN:50000}
    datafill-maxlen: ${DATAFILL_STREAM_MAXLEN:50000}
    dlq-maxlen: ${DLQ_STREAM_MAXLEN:10000}
  wecom:
    root-department-id: ${WECOM_ROOT_DEPT_ID:1}
  agent:
    daily-max-default: ${AGENT_DAILY_MAX:100}
    batch-import-daily-max: ${AGENT_BATCH_IMPORT_DAILY_MAX:200}
    rotation-lock-ttl-seconds: ${AGENT_ROTATION_LOCK_TTL:60}
  transfer:
    form-url: ${TRANSFER_FORM_URL:}
  school-entry-url: ${SCHOOL_ENTRY_URL:http://<YOUR_SERVER_IP>/s}
  school-rate-limit:
    max-per-minute: ${SCHOOL_RATE_LIMIT_MAX:30}
    window-seconds: 60

---
spring:
  config:
    activate:
      on-profile: dev
  # ===== 数据源 =====
  datasource:
    url: jdbc:mysql://localhost:3306/bookstore_qrcode?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai  # MySQL JDBC 连接串（开发环境）
    username: root                                                                # 数据库用户名
    password: ${DB_PASSWORD:}                                                     # 数据库密码（无默认值，环境变量注入）
    hikari:
      maximum-pool-size: 30          # 连接池上限
      minimum-idle: 4                # 最少空闲连接
      connection-timeout: 5000       # 获取连接超时 5s
      idle-timeout: 600000           # 空闲回收 10min
      max-lifetime: 1800000          # 最大存活 30min
  # ===== Redis =====
  data:
    redis:
      host: localhost                   # Redis 主机地址
      port: 6379                        # Redis 端口
      timeout: 15s                      # Redis 命令超时（需 > XREADGROUP 最大 block 时长 10s）

# ===== 企业微信 =====
wecom:
  corp-id: ${WECOM_CORP_ID:}                                              # 企业微信 CorpID
  corp-secret: ${WECOM_CORP_SECRET:}                                      # 企业微信应用 Secret（不设默认值）
  callback-token: ${WECOM_CALLBACK_TOKEN:dev-token}                       # 回调 URL 验证 Token
  callback-encoding-aes-key: ${WECOM_CALLBACK_AES_KEY:}                   # 回调消息 AES 密钥（不设默认值）

---
spring:
  config:
    activate:
      on-profile: prod
  # ===== 数据源 =====
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/bookstore_qrcode?useSSL=true&serverTimezone=Asia/Shanghai  # MySQL JDBC 连接串（生产环境，启用 SSL）
    username: ${DB_USERNAME:bookstore}              # 数据库用户名（环境变量注入）
    password: ${DB_PASSWORD}                        # 数据库密码（环境变量注入，无默认值）
    hikari:
      maximum-pool-size: 50          # 连接池上限（≥ Worker+Undertow 总线程数 42）
      minimum-idle: 8                # 最少空闲连接
      connection-timeout: 5000       # 获取连接超时 5s
      idle-timeout: 600000           # 空闲回收 10min
      max-lifetime: 1800000          # 最大存活 30min
  thymeleaf:
    cache: true                                    # 生产环境启用模板缓存以提升性能
  jpa:
    show-sql: false                                # 生产环境关闭 SQL 日志
  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}           # Redis 主机地址
      port: 6379                        # Redis 端口
      password: ${REDIS_PASSWORD}                 # Redis 密码（环境变量注入，无默认值）
      timeout: 15s                      # Redis 命令超时（需 > XREADGROUP 最大 block 时长 10s）

# ===== 企业微信 =====
wecom:
  corp-id: ${WECOM_CORP_ID}                              # 企业微信 CorpID（环境变量注入）
  corp-secret: ${WECOM_CORP_SECRET}                      # 企业微信应用 Secret（环境变量注入）
  callback-token: ${WECOM_CALLBACK_TOKEN}                # 回调 URL 验证 Token（环境变量注入）
  callback-encoding-aes-key: ${WECOM_CALLBACK_AES_KEY}   # 回调消息 AES 密钥（环境变量注入）

---
spring:
  config:
    activate:
      on-profile: staging
  # ===== 数据源 =====
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/bookstore_qrcode_staging?useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:bookstore_staging}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  thymeleaf:
    cache: true
  jpa:
    show-sql: false
  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 15s
