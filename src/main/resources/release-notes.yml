# 版本更新页的人工定稿内容。
# 每条 date 是上线日期；covers 标记这条记录覆盖的提交区间（省略时只覆盖 date 当天），
# 区间内的原始提交不再重复展示。items 里 kind 可写「新增 / 修复 / 调整」，也可省略。
# 没整理的日期会自动回落到构建期生成的原始提交，折叠显示。
versions:
  - date: 2026-11-06
    title: 新增版本更新页
    covers: 2026-11-06 ~ 2026-11-06
    items:
      - kind: 新增
        text: "「系统管理 → 版本更新」页，按上线时间倒序列出每次更新做了什么"
      - kind: 新增
        text: "没来得及整理的日子会自动回落到开发提交记录，折叠显示，不会漏"
      - kind: 调整
        text: "默认只看最近 3 个月，需要时可展开查看更早的更新"

  - date: 2026-11-05
    title: 接待员日限可自助配置
    covers: 2026-11-05 ~ 2026-11-05
    items:
      - kind: 新增
        text: "系统配置页新增「接待员日限」卡片，可保存默认值并一键应用到全部服务老师"
      - kind: 修复
        text: "点「应用到全部」报 500——备份表建表语句缺少事务"

  - date: 2026-11-04
    title: 部门准入白名单
    covers: 2026-11-02 ~ 2026-11-04
    items:
      - kind: 新增
        text: "新增部门准入白名单后台页，可预览影响范围后一键应用"
      - kind: 新增
        text: "可按部门限制哪些接待员能进入活码池、被分配到活码"
      - kind: 新增
        text: "每日重置时会清退不在白名单内的接待员，避免手动操作绕过限制"
      - kind: 修复
        text: "修复并发应用、降级时误删接待员、预览漏报等问题"

  - date: 2026-11-03
    title: 告警页操作修复
    covers: 2026-11-03 ~ 2026-11-03
    items:
      - kind: 修复
        text: "「全部状态」筛选丢失、归档后不显示操作人、分页越界"
      - kind: 修复
        text: "超大页码导致页码序列倒序膨胀"

  - date: 2026-11-02
    title: 告警待处理卡片与自动关闭
    covers: 2026-10-29 ~ 2026-11-02
    items:
      - kind: 新增
        text: "告警页顶部新增「待处理事项」卡片，可直接跳到对应页面处理"
      - kind: 新增
        text: "告警页默认只看未处理，支持归档；明细增加「最近发生 / 次数」两列"
      - kind: 调整
        text: "告警条件恢复后自动关闭，每小时合并重复与过期归档"
      - kind: 调整
        text: "企微 48002 改为系统级每天一条，并计入交接欢迎语计数"

  - date: 2026-10-15
    title: 编辑页保存修复
    covers: 2026-10-15 ~ 2026-10-15
    items:
      - kind: 修复
        text: "学校 / 分类 / 联盟的编辑页点保存报 400——页面脚本抢走了表单提交地址"

  - date: 2026-10-10
    title: 年级标签归并与定时任务防双跑
    covers: 2026-10-10 ~ 2026-10-10
    items:
      - kind: 新增
        text: "年级标签归并后台看板，支持试运行、一键启动、删旧标签与孤儿清理"
      - kind: 调整
        text: "定时任务加跨机锁与限流，两台机器不再重复跑同一批任务"
      - kind: 修复
        text: "死信重放计数把在途消息也算进去，导致封顶失效"
      - kind: 修复
        text: "表单模板编辑器现在能指定标签组，年级标签不会再被打回默认组"

  - date: 2026-09-29
    title: 打标卡死修复与消息消费加固
    covers: 2026-09-29 ~ 2026-09-29
    items:
      - kind: 修复
        text: "打标时会与客户标签表互锁卡死约 30 秒——改为独立事务后不再卡"
      - kind: 新增
        text: "消息消费加线程监督、死信重放限次与积压巡检，出问题不再静默"

  - date: 2026-09-22
    title: 客户关系对账与图片迁移 OSS
    covers: 2026-09-21 ~ 2026-09-22
    items:
      - kind: 新增
        text: "重建客户关系表，按员工逐一对账；删除、转移、继承都会落到关系表"
      - kind: 调整
        text: "封面图/卡片图改存阿里云 OSS，两台机器看到的是同一张图"
      - kind: 修复
        text: "全量同步遇到畸形的成功响应时整个员工跳过，客户不会被误标为已流失"
      - kind: 修复
        text: "在职继承遇到客户有多个服务老师时不再转错人"
      - kind: 修复
        text: "图片版表单补上幼儿园年级，年级裁剪改成后台可编辑"
