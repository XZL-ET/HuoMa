<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN"
      th:replace="~{download/layout :: layout(title='我的下载记录', content=~{::#content})}">
<body>
<div id="content">
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h5 class="mb-0">🕐 我的下载记录</h5>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="badge bg-info" th:text="'共下载 ' + ${distinctSchools} + ' 所学校'"></span>
                <span class="badge bg-secondary" th:text="'累计 ' + ${totalDownloads} + ' 次'"></span>
                <a th:href="@{/download}" class="btn btn-sm btn-outline-primary">
                    ← 返回下载中心
                </a>
            </div>
        </div>
        <div class="card-body p-0">
            <!-- 桌面端：表格 -->
            <div class="d-none d-md-block">
                <table class="table table-hover mb-0" th:if="${!history.isEmpty()}">
                    <thead class="table-light">
                        <tr>
                            <th>学校</th>
                            <th>城市</th>
                            <th>区县</th>
                            <th>负责人</th>
                            <th>下载时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row : ${history}">
                            <td th:text="${row.schoolName}"></td>
                            <td th:text="${row.regionCity}"></td>
                            <td th:text="${row.regionDistrict}"></td>
                            <td th:text="${row.managerName}"></td>
                            <td th:text="${#temporals.format(row.downloadedAt, 'yyyy-MM-dd HH:mm')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- 手机端：卡片列表 -->
            <div class="d-md-none p-3" th:if="${!history.isEmpty()}">
                <div class="history-mobile-card" th:each="row : ${history}">
                    <div class="hc-header" th:text="${row.schoolName}">学校名</div>
                    <div class="hc-row">
                        <span class="hc-label">📍 城市</span>
                        <span class="hc-value" th:text="${row.regionCity}">城市</span>
                    </div>
                    <div class="hc-row">
                        <span class="hc-label">🏘️ 区县</span>
                        <span class="hc-value" th:text="${row.regionDistrict}">区县</span>
                    </div>
                    <div class="hc-row" th:if="${row.managerName != null}">
                        <span class="hc-label">👤 负责人</span>
                        <span class="hc-value" th:text="${row.managerName}">负责人</span>
                    </div>
                    <div class="hc-row">
                        <span class="hc-label">🕐 下载时间</span>
                        <span class="hc-value" th:text="${#temporals.format(row.downloadedAt, 'yyyy-MM-dd HH:mm')}">时间</span>
                    </div>
                </div>
            </div>
            <!-- 空状态（共用） -->
            <div class="text-center py-5" th:unless="${!history.isEmpty()}">
                <span style="font-size: 3rem;">📦</span>
                <p class="text-muted mt-2">还没有下载记录</p>
                <a th:href="@{/download}" class="btn btn-primary btn-sm">去下载</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
