<!-- form/fill-resend.html — standalone, no layout (customer-facing), 补发表单 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <title>甘肃省新华书店 · 教材服务</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f5f6fa; }
        .org-topbar { background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%); color: white; padding: 14px 16px; text-align: center; }
        .org-topbar .brand-name { font-size: 1rem; font-weight: 700; letter-spacing: 1px; }
        .org-topbar .brand-sub { font-size: 0.75rem; opacity: 0.85; margin-top: 2px; }
        .privacy-notice { background: #fef9e7; border-left: 3px solid #f39c12; padding: 10px 14px; font-size: 0.8rem; color: #7d6608; margin: 1rem 0; border-radius: 0 8px 8px 0; line-height: 1.6; }
        .org-footer { text-align: center; padding: 20px 16px 28px; color: #999; font-size: 0.75rem; line-height: 2; }
        .org-footer a { color: #2980b9; text-decoration: none; }
        .subject-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .subject-chip { border:1px solid #dee2e6; border-radius:8px; padding:6px 14px; cursor:pointer; background:#fff; user-select:none; }
        .subject-chip.checked { border-color:#2980b9; background:#eaf4fb; color:#1a5276; font-weight:600; }
        .link-card { border:1px solid #eef0f3; border-radius:8px; padding:10px 14px; margin-bottom:10px; }
        .link-card a { text-decoration:none; font-weight:600; color:#1a5276; }
    </style>
</head>
<body>
<div class="org-topbar">
    <div class="brand-name">甘肃省新华书店</div>
    <div class="brand-sub">教材发行服务</div>
</div>
<div class="container py-4" style="max-width:500px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="text-center mb-2" th:text="${schoolName != null ? schoolName : '资料领取'}"></h5>
            <p class="text-center text-muted small mb-3"
               th:text="${#strings.isEmpty(subtitle)} ? '填写年级和科目，免费领本年级试题' : ${subtitle}"></p>

            <div class="privacy-notice">
                <strong>隐私说明：</strong>您填写的信息仅用于新华书店教材发行对接服务，不会向第三方泄露或用于其他目的。提交即表示您同意我们收集以下信息。
            </div>

            <form id="resendForm">
                <input type="hidden" id="customerId" th:value="${customerId}">
                <input type="hidden" id="schoolName" th:value="${schoolName}">
                <div id="formFields"></div>
                <button type="submit" class="btn btn-primary w-100 mt-3">提交并领取</button>
            </form>
            <div id="submitMsg" class="text-center mt-2" style="display:none;"></div>

            <!-- 提交成功后展示试题链接列表 -->
            <div id="linkList" style="display:none;" class="mt-3"></div>
        </div>
    </div>
    <div class="org-footer">
        <strong style="color:#555;">甘肃省新华书店有限责任公司</strong><br>
        官网：<a href="https://www.gsxhsd.com" target="_blank" rel="noopener">www.gsxhsd.com</a><br>
        <span style="color:#bbb;">如有疑问请联系各区县新华书店</span><br>
        <a href="http://www.beian.gov.cn/" target="_blank" rel="noopener" style="color:#bbb;text-decoration:none;">联网备案号 62010502001634</a> 丨 <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:#bbb;text-decoration:none;">工信部备案号 陇ICP备20001858号-1</a><br>
        Copyright © 2025 甘肃省新华书店
    </div>
</div>
<script th:inline="javascript">
    var fields = JSON.parse(/*[[${fieldsJson}]]*/ '[]');

    // ===== 动态表单字段渲染（支持 select 单选、multiselect 多选）=====
    var container = document.getElementById('formFields');
    fields.forEach(function(f) {
        var div = document.createElement('div'); div.className = 'mb-3';
        var label = document.createElement('label');
        label.className = 'form-label'; label.textContent = f.label + (f.required ? ' *' : '');
        div.appendChild(label);
        if (f.type === 'multiselect') {
            var grid = document.createElement('div');
            grid.className = 'subject-grid';
            (f.options || []).forEach(function(o) {
                var chip = document.createElement('div');
                chip.className = 'subject-chip';
                chip.textContent = o;
                chip.dataset.value = o;
                chip.addEventListener('click', function() {
                    chip.classList.toggle('checked');
                });
                grid.appendChild(chip);
            });
            div.appendChild(grid);
            div.dataset.fieldType = 'multiselect';
            div.dataset.fieldName = f.name;
        } else if (f.type === 'select') {
            var sel = document.createElement('select');
            sel.className = 'form-select'; sel.name = f.name; sel.required = f.required || false;
            var defaultOpt = document.createElement('option');
            defaultOpt.value = ''; defaultOpt.textContent = '请选择';
            sel.appendChild(defaultOpt);
            (f.options || []).forEach(function(o) {
                var opt = document.createElement('option');
                opt.value = o; opt.textContent = o;
                sel.appendChild(opt);
            });
            div.appendChild(sel);
        } else {
            var input = document.createElement('input');
            input.type = 'text'; input.className = 'form-control';
            input.name = f.name; input.required = f.required || false;
            div.appendChild(input);
        }
        container.appendChild(div);
    });

    // ===== 提交 =====
    document.getElementById('resendForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var fieldData = {};
        var valid = true;
        fields.forEach(function(f) {
            if (f.type === 'multiselect') {
                var box = document.querySelector('[data-field-name="' + f.name + '"]');
                var vals = [];
                if (box) box.querySelectorAll('.subject-chip.checked').forEach(function(c) { vals.push(c.dataset.value); });
                fieldData[f.name] = vals;
                if (f.required && vals.length === 0) valid = false;
            } else {
                var el = document.querySelector('[name="' + f.name + '"]');
                if (el) {
                    fieldData[f.name] = el.value;
                    if (f.required && !el.value) valid = false;
                }
            }
        });
        if (!valid) {
            var msg = document.getElementById('submitMsg');
            msg.style.display = '';
            msg.innerHTML = '<span class="text-danger">❌ 请完整填写必填项</span>';
            return;
        }

        var btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = '提交中...';
        var msg = document.getElementById('submitMsg');

        var body = {
            customerId: parseInt(document.getElementById('customerId').value),
            schoolName: document.getElementById('schoolName').value || null,
            fieldData: fieldData
        };

        fetch('/api/form/resend-submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        }).then(function(r) { return r.json(); }).then(function(d) {
            msg.style.display = '';
            if (d.success) {
                msg.innerHTML = '<span class="text-success">✅ 提交成功！</span>';
                var links = d.links || [];
                if (links.length > 0) {
                    var list = document.getElementById('linkList');
                    list.innerHTML = '<h6 class="text-center text-muted">🎁 您的专属试题</h6>';
                    links.forEach(function(l) {
                        var card = document.createElement('div');
                        card.className = 'link-card';
                        card.innerHTML = '<div>📚 <a href="' + l.url + '" target="_blank" rel="noopener">'
                            + (l.subject ? '【' + l.subject + '】' : '') + (l.title || '点击领取试题') + '</a></div>';
                        list.appendChild(card);
                    });
                    list.style.display = '';
                }
                document.getElementById('resendForm').style.display = 'none';
            } else {
                msg.innerHTML = '<span class="text-danger">❌ ' + (d.error || '提交失败') + '</span>';
                btn.disabled = false; btn.textContent = '提交并领取';
            }
        }).catch(function() {
            msg.style.display = '';
            msg.innerHTML = '<span class="text-danger">❌ 网络异常，请重试</span>';
            btn.disabled = false; btn.textContent = '提交并领取';
        });
    });
</script>
</body>
</html>
