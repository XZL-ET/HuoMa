<!-- form/success.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交成功</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f5f6fa;">
<div class="container py-5 text-center" style="max-width:400px;">
    <div class="card shadow-sm p-5">
        <div style="font-size:56px;">✅</div>
        <h5 class="mt-3">信息提交成功</h5>
        <p class="text-muted">老师已收到孩子信息，后续服务将更加精准</p>
        <button class="btn btn-outline-secondary mt-2" onclick="tryClose()">✕ 关闭</button>
        <p id="closeHint" class="text-muted small mt-2" style="display:none;">点击左上角 ✕ 或右滑即可关闭</p>
    </div>
</div>
<script>
function tryClose() {
    // 微信环境：优先用 WeixinJSBridge（无需 JS-SDK 签名）
    if (typeof WeixinJSBridge !== 'undefined' && WeixinJSBridge.call) {
        WeixinJSBridge.call('closeWindow');
        return;
    }
    // 普通浏览器 / JS-SDK 已配置
    if (typeof wx !== 'undefined' && wx.closeWindow) {
        wx.closeWindow();
        return;
    }
    // 兜底
    window.close();
    // 都关不掉时显示提示
    setTimeout(function() {
        document.getElementById('closeHint').style.display = 'block';
    }, 300);
}
</script>
</body>
</html>
