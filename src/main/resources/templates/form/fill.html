<!-- form/fill.html — standalone, no layout (customer-facing) -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <title>甘肃省新华书店 · 教材服务</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
    <style>
        body { background:#f5f6fa; }
        .org-topbar { background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%); color: white; padding: 8px 16px; text-align: center; }
        .org-topbar .brand-name { font-size: 0.9rem; font-weight: 700; letter-spacing: 1px; }
        .org-topbar .brand-sub { font-size: 0.7rem; opacity: 0.85; margin-top: 1px; }
        .privacy-notice { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 0.72rem; color: #7d6608; margin: 0.5rem 0; border-radius: 0 8px 8px 0; line-height: 1.4; }
        .org-footer { text-align: center; padding: 10px 12px 16px; color: #999; font-size: 0.7rem; line-height: 1.6; }
        .org-footer a { color: #2980b9; text-decoration: none; }
        .stage-btn { border:1px solid #dee2e6; border-radius:8px; padding:8px 0; text-align:center; cursor:pointer; background:#fff; font-size:0.9rem; }
        .stage-btn.active { border-color:#2980b9; background:#eaf4fb; color:#1a5276; font-weight:700; }
        .school-item { padding:8px 10px; border:1px solid #eef0f3; border-radius:8px; margin-bottom:6px; cursor:pointer; }
        .school-item.selected { border-color:#2980b9; background:#eaf4fb; }
        .last-hint { background:#f0f7ee; border:1px solid #d4e7cd; border-radius:8px; padding:8px 10px; font-size:0.8rem; color:#3c763d; margin-bottom:0.75rem; cursor:pointer; }
    </style>
</head>
<body>
<div class="org-topbar">

    <div class="brand-name">甘肃省新华书店</div>
    <div class="brand-sub">教材发行服务</div>
</div>
<div class="container py-2" style="max-width:500px;">
    <div class="card shadow-sm">
        <div class="card-body p-3">
            <h5 class="text-center" th:classappend="${imageMode} ? 'mb-3' : 'mb-1'">
                <span th:if="${imageMode}" id="imageHeading"></span>
                <span th:unless="${imageMode}" th:text="${groupName != null ? groupName : schoolName}">学校名</span>
            </h5>
            <p id="formSubtitle" class="text-center text-muted small mb-2" style="display:none;"></p>

            <form id="collectForm">
                <input type="hidden" id="qrCodeId" th:value="${qrCodeId}">
                <input type="hidden" id="customerId" th:value="${customerId}">
                <!-- 区域联盟：学校选择下拉框 -->
                <div class="mb-2" id="schoolPicker" th:if="${schoolList != null and !schoolList.isEmpty()}">
                    <label class="form-label">所属学校 <span class="text-danger">*</span></label>
                    <select id="schoolSelect" class="form-select" required>
                        <option value="">请选择学校</option>
                        <option th:each="s : ${schoolList}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <!-- 县区码：三级级联选校 -->
                <div id="countyPicker" style="display:none;">
                    <div class="mb-2">
                        <label class="form-label">学段 <span class="text-danger">*</span></label>
                        <div class="row g-2" id="stageButtons">
                            <div class="col-3"><div class="stage-btn" data-stage="小学">小学</div></div>
                            <div class="col-3"><div class="stage-btn" data-stage="初中">初中</div></div>
                            <div class="col-3"><div class="stage-btn" data-stage="高中">高中</div></div>
                            <div class="col-3"><div class="stage-btn" data-stage="幼儿园">幼儿园</div></div>
                            <div class="col-3"><div class="stage-btn" data-stage="未分类">未分类</div></div>
                        </div>
                    </div>
                    <div class="mb-2" id="schoolSearchBox" style="display:none;">
                        <label class="form-label">学校 <span class="text-danger">*</span></label>
                        <input type="text" id="schoolSearch" class="form-control" placeholder="搜索学校名称 / 拼音首字母">
                        <div id="schoolList" class="mt-2" style="max-height:220px;overflow:auto;"></div>
                    </div>
                    <div class="mb-2" id="gradeBox" style="display:none;">
                        <label class="form-label">年级 + 班级 <span class="text-danger">*</span></label>
                        <div class="row g-2">
                            <div class="col-6">
                                <select id="gradeSelect" class="form-select"></select>
                            </div>
                            <div class="col-6">
                                <input type="text" id="classInput" class="form-control" placeholder="如：2班">
                            </div>
                        </div>
                    </div>
                </div>
                <div id="formFields"></div>
                <!-- 隐私声明 -->
                <div class="privacy-notice">
                    <strong>隐私说明：</strong><span th:text="${privacyNotice}">您填写的信息仅用于新华书店教材发行对接服务，不会向第三方泄露或用于其他目的。提交即表示您同意我们收集以下信息。</span>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2" th:text="${imageMode} ? ${imageButtonText} : '提交'">提交</button>
            </form>
            <div id="submitMsg" class="text-center mt-2" style="display:none;"></div>
        </div>
    </div>
    <div class="org-footer">
        <strong style="color:#555;">甘肃省新华书店有限责任公司</strong><br>
        官网：<a href="https://www.gsxhsd.com" target="_blank" rel="noopener">www.gsxhsd.com</a><br>
        <span style="color:#bbb;">如有疑问请联系各区县新华书店</span><br>
        <a href="http://www.beian.gov.cn/" target="_blank" rel="noopener" style="color:#bbb;text-decoration:none;">联网备案号 62010502001634</a> 丨 <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:#bbb;text-decoration:none;">工信部备案号 陇ICP备20001858号-1</a><br>
        Copyright © 2026 甘肃省新华书店
    </div>
</div>
<script th:inline="javascript">
    var fields = JSON.parse(/*[[${fieldsJson}]]*/ '[]');
    var isCountyCode = /*[[${countyCode ?: false}]]*/ false;
    var imageMode = /*[[${imageMode ?: false}]]*/ false;
    var gradeImages = JSON.parse(/*[[${gradeImagesJson ?: '{}'}]]*/ '{}');
    var schoolName = /*[[${schoolName ?: ''}]]*/ '';
    var subtitle = /*[[${subtitle ?: ''}]]*/ '';
    var imageHeadingLine1 = /*[[${imageHeadingLine1 ?: '您是 {school} 的学生'}]]*/ '您是 {school} 的学生';
    var imageHeadingLine2 = /*[[${imageHeadingLine2 ?: '请您选择正在使用的教材版本'}]]*/ '请您选择正在使用的教材版本';
    var imageSubtitle = /*[[${imageSubtitle ?: ''}]]*/ '';
    var imageGradeHint = /*[[${imageGradeHint ?: '请选择年级'}]]*/ '请选择年级';

    // ===== 图片版文案渲染（学校行、副标题） =====
    function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = (s == null) ? '' : s;
        return d.innerHTML;
    }

    (function renderHeading() {
        if (imageMode) {
            var headingEl = document.getElementById('imageHeading');
            var line1 = escapeHtml(imageHeadingLine1).replace(/\{school\}/g, '<strong>' + escapeHtml(schoolName) + '</strong>');
            headingEl.innerHTML = line1 + '<br>' + escapeHtml(imageHeadingLine2);
        }
        var sub = imageMode ? imageSubtitle : (subtitle || '请填写孩子信息，以便为您精准服务');
        if (sub) {
            var subEl = document.getElementById('formSubtitle');
            subEl.textContent = sub;
            subEl.style.display = '';
        }
    })();

    // ===== 动态表单字段（既有逻辑） =====
    var container = document.getElementById('formFields');
    fields.forEach(function(f) {
        var div = document.createElement('div'); div.className = 'mb-2';
        // 图片版：顶部文案已说明选年级，不渲染字段标签
        if (!imageMode) {
            var label = document.createElement('label');
            label.className = 'form-label'; label.textContent = f.label + (f.required ? ' *' : '');
            div.appendChild(label);
        }
        if (f.type === 'select') {
            var sel = document.createElement('select');
            sel.className = 'form-select'; sel.name = f.name; sel.required = f.required || false;
            var defaultOpt = document.createElement('option');
            defaultOpt.value = ''; defaultOpt.textContent = '请选择';
            sel.appendChild(defaultOpt);
            (f.options || []).forEach(function(o) {
                var opt = document.createElement('option');
                opt.value = o; opt.textContent = o;
                sel.appendChild(opt);
            });
            div.appendChild(sel);
            // 图片版：只要有 grade 下拉即联动展示对应语文课本封面
            if (imageMode && f.name === 'grade') {
                var cover = document.createElement('img');
                cover.className = 'img-fluid rounded border mt-2 mb-2 d-block mx-auto';
                cover.style.maxHeight = '180px';
                div.appendChild(cover);
                // 进页面默认展示学段第一个年级的封面（年级仍需手选，选中后再联动更新）
                var defaultGrade = (f.options && f.options.length > 0) ? f.options[0] : null;
                if (defaultGrade && gradeImages[defaultGrade]) {
                    cover.src = gradeImages[defaultGrade];
                } else {
                    cover.style.display = 'none';
                }
                // 封面下提示（如"请选择年级"）
                if (imageGradeHint) {
                    var hint = document.createElement('div');
                    hint.className = 'text-center text-muted small mb-1';
                    hint.textContent = imageGradeHint;
                    div.appendChild(hint);
                }
                sel.addEventListener('change', function() {
                    var url = gradeImages[sel.value];
                    if (url) { cover.src = url; cover.style.display = ''; }
                    else { cover.style.display = 'none'; }
                });
            }
        } else {
            var input = document.createElement('input');
            input.type = 'text'; input.className = 'form-control';
            input.name = f.name; input.required = f.required || false;
            div.appendChild(input);
        }
        container.appendChild(div);
    });

    // ===== 县区码三级级联 =====
    var selectedStage = null, selectedSchool = null, allSchools = [];
    var lastKey = 'county_last_selection';

    function pinyinInitials(name) {
        try { return window.pinyinPro.pinyin(name, {pattern:'first', toneType:'none', type:'array'}).join(''); }
        catch (e) { return ''; }
    }
    function pinyinFull(name) {
        try { return window.pinyinPro.pinyin(name, {toneType:'none', type:'array'}).join(''); }
        catch (e) { return ''; }
    }

    if (isCountyCode) {
        document.getElementById('countyPicker').style.display = '';
        // 学段按钮
        document.querySelectorAll('#stageButtons .stage-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                selectedStage = btn.dataset.stage;
                selectedSchool = null;
                document.querySelectorAll('#stageButtons .stage-btn').forEach(function(b){ b.classList.remove('active'); });
                btn.classList.add('active');
                loadSchools(selectedStage);
                loadGrades(selectedStage);
                document.getElementById('schoolSearchBox').style.display = '';
                document.getElementById('gradeBox').style.display = '';
                document.getElementById('schoolSearch').value = '';
                renderSchools('');
            });
        });
        // 搜索过滤
        document.getElementById('schoolSearch').addEventListener('input', function() {
            renderSchools(this.value.trim().toLowerCase());
        });
        // 上次选择提示
        var last = localStorage.getItem(lastKey);
        if (last) {
            try {
                var lastObj = JSON.parse(last);
                var hint = document.createElement('div');
                hint.className = 'last-hint';
                hint.textContent = '上次：' + lastObj.stage + ' ' + lastObj.schoolName + ' ' + lastObj.grade + lastObj.className + '，点击回填';
                hint.addEventListener('click', function() { restoreLast(lastObj); });
                document.getElementById('countyPicker').insertBefore(hint, document.getElementById('stageButtons'));
            } catch (e) {}
        }
    }

    function loadSchools(stage) {
        var qrCodeId = document.getElementById('qrCodeId').value;
        fetch('/api/form/schools?qrCodeId=' + qrCodeId + '&category=' + encodeURIComponent(stage))
            .then(function(r){ return r.json(); })
            .then(function(d){ allSchools = d.schools || []; renderSchools(''); })
            .catch(function(){ allSchools = []; renderSchools(''); });
    }

    function renderSchools(query) {
        var list = document.getElementById('schoolList');
        list.innerHTML = '';
        var filtered = allSchools;
        if (query) {
            filtered = allSchools.filter(function(s) {
                var name = s.schoolName.toLowerCase();
                var initials = pinyinInitials(s.schoolName).toLowerCase();
                var full = pinyinFull(s.schoolName).toLowerCase();
                return name.indexOf(query) >= 0 || initials.indexOf(query) >= 0 || full.indexOf(query) >= 0;
            });
        }
        filtered.forEach(function(s) {
            var item = document.createElement('div');
            item.className = 'school-item' + (selectedSchool && selectedSchool.schoolId === s.schoolId ? ' selected' : '');
            item.textContent = s.schoolName;
            item.addEventListener('click', function() {
                selectedSchool = s;
                renderSchools(document.getElementById('schoolSearch').value.trim().toLowerCase());
            });
            list.appendChild(item);
        });
    }

    function loadGrades(stage) {
        fetch('/api/form/grades?category=' + encodeURIComponent(stage))
            .then(function(r){ return r.json(); })
            .then(function(d) {
                var sel = document.getElementById('gradeSelect');
                sel.innerHTML = '';
                (d.grades || []).forEach(function(g) {
                    var o = document.createElement('option');
                    o.value = g; o.textContent = g;
                    sel.appendChild(o);
                });
            });
    }

    function restoreLast(obj) {
        selectedStage = obj.stage;
        document.querySelectorAll('#stageButtons .stage-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.stage === obj.stage); });
        loadSchools(obj.stage); loadGrades(obj.stage);
        document.getElementById('schoolSearchBox').style.display = '';
        document.getElementById('gradeBox').style.display = '';
        document.getElementById('classInput').value = obj.className || '';
        // school 回填在 loadSchools 后按名称匹配；grade 回填在 loadGrades 填充选项后设置
        var check = setInterval(function() {
            var gradeSel = document.getElementById('gradeSelect');
            if (gradeSel.options.length > 0) gradeSel.value = obj.grade || '';
            var match = allSchools.find(function(s){ return s.schoolName === obj.schoolName; });
            if (match) { selectedSchool = match; renderSchools(''); }
            if (match && gradeSel.options.length > 0) clearInterval(check);
        }, 100);
    }

    // ===== 提交 =====
    document.getElementById('collectForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var fieldData = {};
        fields.forEach(function(f) {
            var el = document.querySelector('[name="' + f.name + '"]');
            if (el) fieldData[f.name] = el.value;
        });
        var btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = '提交中...';
        var msg = document.getElementById('submitMsg');

        var body = {
            qrCodeId: parseInt(document.getElementById('qrCodeId').value),
            customerId: parseInt(document.getElementById('customerId').value),
            fieldData: fieldData
        };

        var schoolSelect = document.getElementById('schoolSelect');
        if (schoolSelect) body.schoolName = schoolSelect.value;

        if (isCountyCode) {
            if (!selectedStage || !selectedSchool) {
                msg.style.display = '';
                msg.innerHTML = '<span class="text-danger">❌ 请先选择学段和学校</span>';
                btn.disabled = false; btn.textContent = '提交';
                return;
            }
            body.schoolId = selectedSchool.schoolId;
            body.schoolName = selectedSchool.schoolName;
            fieldData.grade = document.getElementById('gradeSelect').value;
            fieldData.class = document.getElementById('classInput').value;
            body.fieldData = fieldData;
            // 记住本次选择
            localStorage.setItem(lastKey, JSON.stringify({
                stage: selectedStage, schoolId: selectedSchool.schoolId,
                schoolName: selectedSchool.schoolName,
                grade: fieldData.grade, className: fieldData.class
            }));
        }

        fetch('/api/form/submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        }).then(function(r) { return r.json(); }).then(function(d) {
            msg.style.display = '';
            if (d.success) {
                msg.innerHTML = '<span class="text-success">✅ 提交成功！</span>';
                setTimeout(function() { window.location.href = '/form/success'; }, 1000);
            } else {
                msg.innerHTML = '<span class="text-danger">❌ ' + (d.error || '提交失败') + '</span>';
                btn.disabled = false; btn.textContent = '提交';
            }
        });
    });
</script>
</body>
</html>
