<!-- form/fill.html — standalone, no layout (customer-facing) -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信息收集 — 新华书店教材服务</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f5f6fa; }
        .org-topbar { background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%); color: white; padding: 10px 16px; text-align: center; font-size: 0.85rem; letter-spacing: 0.5px; }
        .privacy-notice { background: #fef9e7; border-left: 3px solid #f39c12; padding: 10px 14px; font-size: 0.8rem; color: #7d6608; margin: 1rem 0; border-radius: 0 8px 8px 0; line-height: 1.6; }
        .org-footer { text-align: center; padding: 20px 16px 24px; color: #999; font-size: 0.75rem; line-height: 1.8; }
        .org-footer a { color: #666; text-decoration: none; }
    </style>
</head>
<body>
<div class="org-topbar">
    甘肃省新华书店 · 教材发行服务
</div>
<div class="container py-4" style="max-width:500px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="text-center mb-2" th:text="${groupName != null ? groupName : schoolName}"></h5>
            <p class="text-center text-muted small mb-3"
               th:text="${#strings.isEmpty(subtitle)} ? '请填写孩子信息，以便为您精准服务' : ${subtitle}">请填写孩子信息，以便为您精准服务</p>

            <!-- 隐私声明 -->
            <div class="privacy-notice">
                <strong>🔒 隐私说明：</strong>您填写的信息仅用于新华书店教材发行对接服务，不会向第三方泄露或用于其他目的。提交即表示您同意我们收集以上信息。
            </div>

            <form id="collectForm">
                <input type="hidden" id="qrCodeId" th:value="${qrCodeId}">
                <input type="hidden" id="customerId" th:value="${customerId}">
                <!-- 区域联盟：学校选择下拉框 -->
                <div class="mb-3" id="schoolPicker" th:if="${schoolList != null and !schoolList.isEmpty()}">
                    <label class="form-label">所属学校 <span class="text-danger">*</span></label>
                    <select id="schoolSelect" class="form-select" required>
                        <option value="">请选择学校</option>
                        <option th:each="s : ${schoolList}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div id="formFields"></div>
                <button type="submit" class="btn btn-primary w-100 mt-3">提交</button>
            </form>
            <div id="submitMsg" class="text-center mt-2" style="display:none;"></div>
        </div>
    </div>
    <div class="org-footer">
        甘肃省新华书店有限责任公司<br>
        如有疑问请联系各区县新华书店教材科
    </div>
</div>
<script th:inline="javascript">
    var fields = JSON.parse(/*[[${fieldsJson}]]*/ '[]');
    var container = document.getElementById('formFields');
    fields.forEach(function(f) {
        var div = document.createElement('div'); div.className = 'mb-3';
        var label = document.createElement('label');
        label.className = 'form-label'; label.textContent = f.label + (f.required ? ' *' : '');
        div.appendChild(label);
        if (f.type === 'select') {
            var sel = document.createElement('select');
            sel.className = 'form-select'; sel.name = f.name; sel.required = f.required || false;
            var defaultOpt = document.createElement('option');
            defaultOpt.value = ''; defaultOpt.textContent = '请选择';
            sel.appendChild(defaultOpt);
            (f.options || []).forEach(function(o) {
                var opt = document.createElement('option');
                opt.value = o; opt.textContent = o;
                sel.appendChild(opt);
            });
            div.appendChild(sel);
        } else {
            var input = document.createElement('input');
            input.type = 'text'; input.className = 'form-control';
            input.name = f.name; input.required = f.required || false;
            div.appendChild(input);
        }
        container.appendChild(div);
    });

    document.getElementById('collectForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var fieldData = {};
        fields.forEach(function(f) {
            var el = document.querySelector('[name="' + f.name + '"]');
            if (el) fieldData[f.name] = el.value;
        });
        var btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = '提交中...';
        var schoolSelect = document.getElementById('schoolSelect');
        var body = {
            qrCodeId: parseInt(document.getElementById('qrCodeId').value),
            customerId: parseInt(document.getElementById('customerId').value),
            fieldData: fieldData
        };
        if (schoolSelect) body.schoolName = schoolSelect.value;
        fetch('/api/form/submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        }).then(function(r) { return r.json(); }).then(function(d) {
            var msg = document.getElementById('submitMsg'); msg.style.display = '';
            if (d.success) {
                msg.innerHTML = '<span class="text-success">✅ 提交成功！</span>';
                setTimeout(function() { window.location.href = '/form/success'; }, 1000);
            } else {
                msg.innerHTML = '<span class="text-danger">❌ ' + (d.error || '提交失败') + '</span>';
                btn.disabled = false; btn.textContent = '提交';
            }
        });
    });
</script>
</body>
</html>
