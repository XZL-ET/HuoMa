<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='系统配置', content=~{::#content})}">
<body>
<div id="content">
    <h4 class="mb-3">⚙️ 系统配置</h4>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        ✅ <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th style="width:25%">配置键</th>
                        <th>配置值</th>
                        <th style="width:16%">更新时间</th>
                        <th style="width:8%">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${configs}">
                        <td><code th:text="${c.configName} ?: ${c.configKey}"></code></td>
                        <td>
                            <form th:action="@{/admin/system-config/save}" method="post"
                                  class="d-flex align-items-start gap-2">
                                <input type="hidden" name="configKey" th:value="${c.configKey}">
                                <th:block th:if="${#strings.contains(c.configKey, 'welcome_text') or #strings.contains(c.configKey, 'welcome_msg') or #strings.contains(c.configKey, 'transfer_filled') or #strings.contains(c.configKey, 'transfer_unfilled') or #strings.contains(c.configKey, 'transfer_success_msg')}">
                                    <textarea name="configValue" class="form-control form-control-sm" rows="2"
                                              style="max-width:480px" th:text="${c.configValue}"></textarea>
                                </th:block>
                                <th:block th:unless="${#strings.contains(c.configKey, 'welcome_text') or #strings.contains(c.configKey, 'welcome_msg') or #strings.contains(c.configKey, 'transfer_filled') or #strings.contains(c.configKey, 'transfer_unfilled') or #strings.contains(c.configKey, 'transfer_success_msg')}">
                                    <input type="text" name="configValue" th:value="${c.configValue}"
                                           class="form-control form-control-sm" style="max-width:400px">
                                </th:block>
                                <button type="submit" class="btn btn-sm btn-primary flex-shrink-0">
                                    ✓ 保存
                                </button>
                            </form>
                        </td>
                        <td class="text-muted small" th:text="${c.updatedAt}"></td>
                        <td></td>
                    </tr>
                    <tr th:if="${configs.isEmpty()}">
                        <td colspan="4" class="text-center text-muted py-4">
                            📦 暂无配置项
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
