<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='系统配置', content=~{::#content})}">
<body>
<div id="content">
    <h4 class="mb-3">⚙️ 系统配置</h4>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        ✅ <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        ⚠️ <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th style="width:25%">配置键</th>
                        <th>配置值</th>
                        <th style="width:16%">更新时间</th>
                        <th style="width:8%">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${configs}">
                        <td><code th:text="${c.configName} ?: ${c.configKey}"></code></td>
                        <td>
                            <form th:action="@{/admin/system-config/save}" method="post"
                                  class="d-flex align-items-start gap-2">
                                <input type="hidden" name="configKey" th:value="${c.configKey}">
                                <th:block th:if="${#strings.contains(c.configKey, 'welcome_text') or #strings.contains(c.configKey, 'welcome_msg') or #strings.contains(c.configKey, 'transfer_filled') or #strings.contains(c.configKey, 'transfer_unfilled') or #strings.contains(c.configKey, 'transfer_success_msg')}">
                                    <textarea name="configValue" class="form-control form-control-sm" rows="2"
                                              style="max-width:480px" th:text="${c.configValue}"></textarea>
                                </th:block>
                                <th:block th:unless="${#strings.contains(c.configKey, 'welcome_text') or #strings.contains(c.configKey, 'welcome_msg') or #strings.contains(c.configKey, 'transfer_filled') or #strings.contains(c.configKey, 'transfer_unfilled') or #strings.contains(c.configKey, 'transfer_success_msg')}">
                                    <input type="text" name="configValue" th:value="${c.configValue}"
                                           class="form-control form-control-sm" style="max-width:400px">
                                </th:block>
                                <button type="submit" class="btn btn-sm btn-primary flex-shrink-0">
                                    ✓ 保存
                                </button>
                            </form>
                        </td>
                        <td class="text-muted small" th:text="${c.updatedAt}"></td>
                        <td></td>
                    </tr>
                    <tr th:if="${configs.isEmpty()}">
                        <td colspan="4" class="text-center text-muted py-4">
                            📦 暂无配置项
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 图片版文案 -->
    <div class="card border-0 shadow-sm mt-4">
        <div class="card-header bg-white border-bottom-0">
            <h5 class="mb-0">📚 图片版文案</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/system-config/image-copy}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small text-muted mb-1">学校行第一行</label>
                        <input type="text" name="headingLine1" class="form-control form-control-sm"
                               th:value="${imageHeadingLine1}" placeholder="您是 {school} 的学生">
                        <small class="text-muted d-block mt-1">{school} 自动替换为学校名并加粗</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted mb-1">学校行第二行</label>
                        <input type="text" name="headingLine2" class="form-control form-control-sm"
                               th:value="${imageHeadingLine2}" placeholder="请您选择正在使用的教材版本">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted mb-1">副标题（留空隐藏）</label>
                        <input type="text" name="subtitle" class="form-control form-control-sm"
                               th:value="${imageSubtitle}" placeholder="留空则图片版不显示副标题">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted mb-1">封面下提示</label>
                        <input type="text" name="gradeHint" class="form-control form-control-sm"
                               th:value="${imageGradeHint}" placeholder="请选择年级">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted mb-1">按钮文字</label>
                        <input type="text" name="buttonText" class="form-control form-control-sm"
                               th:value="${imageButtonText}" placeholder="确认">
                    </div>
                    <div class="col-12">
                        <label class="form-label small text-muted mb-1">隐私声明（两种模式共用）</label>
                        <textarea name="privacyNotice" class="form-control form-control-sm" rows="2"
                                  th:text="${privacyNotice}"></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary btn-sm">保存图片版文案</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 服务老师日限 -->
    <div class="card border-0 shadow-sm mt-4">
        <div class="card-header bg-white border-bottom-0">
            <h5 class="mb-0">服务老师日限</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/system-config/service-teacher-daily-max}" method="post"
                  class="row g-3 align-items-end">
                <div class="col-auto">
                    <label class="form-label small text-muted mb-1" for="serviceDailyMaxInput">每日可加人数</label>
                    <input id="serviceDailyMaxInput" type="number" name="value" class="form-control form-control-sm"
                           min="1" max="800" required th:value="${serviceTeacherDailyMax}" style="width:140px">
                </div>
                <div class="col-auto">
                    <button type="submit" name="apply" value="false" class="btn btn-outline-primary btn-sm">
                        保存默认值
                    </button>
                </div>
                <div class="col-auto">
                    <button type="submit" name="apply" value="true" class="btn btn-primary btn-sm"
                            onclick="return confirm('将把「所有服务老师」的日限统一改为该值并刷新存量，执行前会自动备份。确认执行？')">
                        保存并应用到全部服务老师
                    </button>
                </div>
            </form>
            <small class="text-muted d-block mt-2">「保存默认值」只影响以后新建的服务老师；「应用到全部」会同时刷新存量服务老师的日限（执行前自动建备份表，可回滚）。</small>
        </div>
    </div>

    <!-- 客户删除员工日报 -->
    <div class="card border-0 shadow-sm mt-4">
        <div class="card-header bg-white border-bottom-0">
            <h5 class="mb-0">客户删除员工日报</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/system-config/deletion-report-recipients}" method="post"
                  class="row g-3 align-items-end">
                <div class="col-auto">
                    <label class="form-label small text-muted mb-1" for="deletionRecipientsInput">接收人企微 userid（逗号分隔）</label>
                    <input id="deletionRecipientsInput" type="text" name="recipients"
                           class="form-control form-control-sm" th:value="${deletionReportRecipients}"
                           style="width:360px" placeholder="例如：zhangsan,lisi,wangwu">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary btn-sm">保存</button>
                </div>
            </form>
            <small class="text-muted d-block mt-2">填写需要接收每日「客户删除员工」汇总日报的管理员企微 userid，多个用逗号分隔；留空则不在企微推送（仍可在「删除记录」页查看）。</small>

            <hr class="my-3">
            <form th:action="@{/admin/system-config/deletion-report-time}" method="post"
                  class="row g-3 align-items-end">
                <div class="col-auto">
                    <label class="form-label small text-muted mb-1" for="deletionTimeInput">定时推送时间</label>
                    <input id="deletionTimeInput" type="time" name="time"
                           class="form-control form-control-sm" th:value="${deletionReportTime}"
                           required style="width:140px">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary btn-sm">保存</button>
                </div>
            </form>
            <small class="text-muted d-block mt-2">设置每天自动推送「客户删除员工」汇总日报的时间，保存后即时生效，无需重启。</small>

            <hr class="my-3">
            <form th:action="@{/admin/system-config/deletion-report/push}" method="post"
                  class="d-flex align-items-center gap-2">
                <button type="submit" class="btn btn-outline-primary btn-sm"
                        onclick="return confirm('立即推送昨日的客户删除员工汇总日报给配置的接收人？')">
                    立即推送昨日日报
                </button>
                <span class="small text-muted">定时任务每天 <span th:text="${deletionReportTime}">09:00</span> 自动推送昨日汇总，此按钮用于立即补推。</span>
            </form>
        </div>
    </div>

    <!-- 运维工具 -->
    <div class="card border-0 shadow-sm mt-4">
        <div class="card-header bg-white border-bottom-0">
            <h5 class="mb-0">🛠️ 运维工具</h5>
        </div>
        <div class="card-body">
            <div class="d-flex flex-wrap gap-3 align-items-center">
                <!-- 标签同步 -->
                <form th:action="@{/admin/tags/sync}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">
                        🔄 同步企微标签
                    </button>
                </form>
                <!-- 备注修复（异步，避免浏览器超时） -->
                <button id="repairBtn" type="button" class="btn btn-outline-warning btn-sm"
                        onclick="repairRemarks()">
                    🔧 修复损坏备注
                </button>
                <span id="repairStatus" class="small text-muted" style="display:none"></span>
            </div>
        </div>
    </div>

    <div id="repairSamples" class="mt-3" style="display:none"></div>

    <script th:inline="javascript">
    async function repairRemarks() {
        if (!confirm('将修复所有已确认客户的备注名（约 1180 条，需 2-4 分钟），确认执行？')) return;

        const btn = document.getElementById('repairBtn');
        const status = document.getElementById('repairStatus');
        const samplesDiv = document.getElementById('repairSamples');
        btn.disabled = true;
        btn.textContent = '⏳ 修复中...';
        status.style.display = 'inline';
        status.textContent = '正在处理，请勿关闭页面...';
        status.className = 'small text-warning ms-2';
        samplesDiv.style.display = 'none';

        try {
            const resp = await fetch('/admin/repair-remarks', { method: 'POST' });
            const data = await resp.json();
            status.textContent = '✅ 修复完成：共 ' + data.repaired + ' 条';
            status.className = 'small text-success ms-2';
            btn.textContent = '🔧 修复损坏备注';

            // 显示修复样本（前5条的前后对比）
            if (data.samples && data.samples.length > 0) {
                let html = '<h6 class="mt-3 mb-2">📋 修复样本（前 ' + data.samples.length + ' 条）</h6>';
                data.samples.forEach(function(s, i) {
                    html += '<div class="card bg-light mb-2 border-0">' +
                        '<div class="card-body py-2 px-3 small">' +
                        '<div class="text-danger mb-1"><b>修复前：</b>' + escapeHtml(s.before) + '</div>' +
                        '<div class="text-success"><b>修复后：</b>' + escapeHtml(s.after) + '</div>' +
                        '</div></div>';
                });
                samplesDiv.innerHTML = html;
                samplesDiv.style.display = 'block';
            }
        } catch (e) {
            status.textContent = '❌ 请求失败，请重试';
            status.className = 'small text-danger ms-2';
            btn.textContent = '🔧 修复损坏备注';
        } finally {
            btn.disabled = false;
        }
    }

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    </script>
</div>
</body>
</html>
