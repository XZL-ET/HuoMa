<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='区域联盟管理', content=~{::main})}">
<main>
<div class="card p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5>🏫 区域联盟管理</h5>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createModal">+ 新建联盟</button>
    </div>
    <div th:if="${groups.isEmpty()}" class="text-muted text-center py-4">暂无联盟</div>
    <table th:if="${!groups.isEmpty()}" class="table table-sm">
        <thead><tr><th>名称</th><th>市州</th><th>县区</th><th>关联活码</th><th>学校名单</th><th>操作</th></tr></thead>
        <tbody>
            <tr th:each="g : ${groups}">
                <td><strong th:text="${g.name}"></strong></td>
                <td th:text="${g.regionCity}"></td>
                <td th:text="${g.regionDistrict}"></td>
                <td>
                    <th:block th:if="${g.qrCodeId != null and qrCodeMap.containsKey(g.qrCodeId)}">
                        <a th:href="@{/qrcodes/{id}(id=${g.qrCodeId})}" class="text-decoration-none"
                           th:text="${qrCodeMap.get(g.qrCodeId).schoolName}"></a>
                        <small class="text-muted d-block" th:text="${qrCodeMap.get(g.qrCodeId).schoolId}"></small>
                    </th:block>
                    <span th:if="${g.qrCodeId == null or !qrCodeMap.containsKey(g.qrCodeId)}" class="text-warning">未设置</span>
                </td>
                <td>
                    <th:block th:if="${schoolCounts.get(g.id) > 0}">
                        <span class="badge bg-info" th:text="${schoolCounts.get(g.id)} + ' 所'"></span>
                        <small class="text-muted d-block text-truncate" style="max-width:200px"
                               th:text="${g.schoolList}"></small>
                    </th:block>
                    <span th:if="${schoolCounts.get(g.id) == 0}" class="text-muted">未设置</span>
                </td>
                <td class="text-nowrap">
                    <button class="btn btn-sm btn-outline-secondary edit-btn"
                            th:data-id="${g.id}" th:data-name="${g.name}"
                            th:data-city="${g.regionCity}" th:data-district="${g.regionDistrict}"
                            th:data-welcome="${g.defaultWelcomeText}" th:data-formid="${g.defaultFormTemplateId}"
                            th:data-qrcodeid="${g.qrCodeId}" th:data-schoollist="${g.schoolList}"
                            data-bs-toggle="modal" data-bs-target="#editModal">✏️ 编辑</button>
                    <form th:action="@{/admin/groups/{id}/delete(id=${g.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('确定删除该联盟？（关联的活码不会删除）')">
                        <button class="btn btn-sm btn-outline-danger">🗑️ 删除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- ═══════════ 新建联盟弹窗 ═══════════ -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">+ 新建区域联盟</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form method="post" th:action="@{/admin/groups/create}">
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">联盟名称 <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" required maxlength="100"
                                   placeholder="如：城关小校联盟">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">市州</label>
                            <input type="text" name="regionCity" class="form-control" maxlength="50"
                                   placeholder="如：兰州市">
                        </div>
                        <div class="col">
                            <label class="form-label">县区 <span class="text-danger">*</span></label>
                            <input type="text" name="regionDistrict" class="form-control" required maxlength="50"
                                   placeholder="如：城关区">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">关联活码</label>
                            <select name="qrCodeId" class="form-select">
                                <option value="">不关联（稍后设置）</option>
                                <option th:each="qr : ${allQrCodes}" th:value="${qr.id}"
                                        th:text="${qr.schoolName + ' (' + qr.schoolId + ' — ' + qr.regionDistrict + ')'}"></option>
                            </select>
                            <small class="text-muted">联盟的唯一活码，多所小校共用这一个码</small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">学校名单</label>
                        <textarea name="schoolList" class="form-control" rows="5" maxlength="2000"
                                  placeholder="每行一个学校名称，如：&#10;红旗小学&#10;朝阳小学&#10;育才小学"></textarea>
                        <small class="text-muted">联盟包含的学校，每行一个。用于备注和表单「学校」字段选项</small>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <label class="form-label">默认欢迎语</label>
                        <textarea name="defaultWelcomeText" class="form-control" rows="2" maxlength="500"
                                  placeholder="留空则使用系统默认"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">默认表单模板</label>
                        <select name="defaultFormTemplateId" class="form-select">
                            <option value="">不设置</option>
                            <option th:each="ft : ${formTemplates}" th:value="${ft.id}"
                                    th:text="${ft.name}"></option>
                        </select>
                        <small class="text-muted">建议选择包含「学校」字段的表单模板</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">确认创建</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ═══════════ 编辑联盟弹窗 ═══════════ -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑区域联盟</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form method="post" id="editForm" th:action="@{/admin/groups/0/update}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">联盟名称 <span class="text-danger">*</span></label>
                            <input type="text" name="name" id="editName" class="form-control" required maxlength="100">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">市州</label>
                            <input type="text" name="regionCity" id="editCity" class="form-control" maxlength="50">
                        </div>
                        <div class="col">
                            <label class="form-label">县区 <span class="text-danger">*</span></label>
                            <input type="text" name="regionDistrict" id="editDistrict" class="form-control" required maxlength="50">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">关联活码</label>
                            <select name="qrCodeId" id="editQrCodeId" class="form-select">
                                <option value="">不关联</option>
                                <option th:each="qr : ${allQrCodes}" th:value="${qr.id}"
                                        th:text="${qr.schoolName + ' (' + qr.schoolId + ' — ' + qr.regionDistrict + ')'}"></option>
                            </select>
                            <small class="text-muted">联盟的唯一活码，多所小校共用这一个码</small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">学校名单</label>
                        <textarea name="schoolList" id="editSchoolList" class="form-control" rows="5" maxlength="2000"
                                  placeholder="每行一个学校名称"></textarea>
                        <small class="text-muted">联盟包含的学校，每行一个。用于备注和表单「学校」字段选项</small>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <label class="form-label">默认欢迎语</label>
                        <textarea name="defaultWelcomeText" id="editWelcome" class="form-control" rows="2" maxlength="500"
                                  placeholder="留空则使用系统默认"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">默认表单模板</label>
                        <select name="defaultFormTemplateId" id="editFormTemplateId" class="form-select">
                            <option value="">不设置</option>
                            <option th:each="ft : ${formTemplates}" th:value="${ft.id}"
                                    th:text="${ft.name}"></option>
                        </select>
                        <small class="text-muted">建议选择包含「学校」字段的表单模板</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存修改</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
/* ── 编辑按钮填充弹窗数据 ── */
document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const id = this.getAttribute('data-id');
        document.getElementById('editForm').action = '/admin/groups/' + id + '/update';
        document.getElementById('editName').value = this.getAttribute('data-name') || '';
        document.getElementById('editCity').value = this.getAttribute('data-city') || '';
        document.getElementById('editDistrict').value = this.getAttribute('data-district') || '';
        document.getElementById('editWelcome').value = this.getAttribute('data-welcome') || '';
        const formId = this.getAttribute('data-formid');
        document.getElementById('editFormTemplateId').value = formId || '';
        const qrCodeId = this.getAttribute('data-qrcodeid');
        document.getElementById('editQrCodeId').value = qrCodeId || '';
        const schoolList = this.getAttribute('data-schoollist');
        document.getElementById('editSchoolList').value = schoolList || '';
    });
});
</script>
</main>
</html>
