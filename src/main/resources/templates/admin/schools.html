<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='学校管理', content=~{::#content})}">
<body>
<div id="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">🏛️ 学校管理</h4>
        <div>
            <button type="button" class="btn btn-outline-success btn-sm me-1"
                    data-bs-toggle="modal" data-bs-target="#importModal">
                📤 CSV导入
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm"
                    data-bs-toggle="modal" data-bs-target="#addModal">
                ➕ 新增学校
            </button>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        ✅ <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        ❌ <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filter bar -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body py-2">
            <form class="row g-2 align-items-center" method="get" th:action="@{/admin/schools}">
                <div class="col-auto">
                    <label class="form-label mb-0 small text-muted">搜索</label>
                    <input type="text" name="keyword" class="form-control form-control-sm"
                           th:value="${keyword}" placeholder="学校名/ID/城市/区县" style="min-width:200px">
                </div>
                <div class="col-auto">
                    <label class="form-label mb-0 small text-muted">市州</label>
                    <select name="city" class="form-select form-select-sm" style="min-width:140px">
                        <option value="">全部市州</option>
                        <option th:each="c : ${cities}" th:value="${c}" th:text="${c}"
                                th:selected="${city != null && city.equals(c)}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label mb-0 small text-muted">区县</label>
                    <input type="text" name="district" class="form-control form-control-sm"
                           th:value="${district}" placeholder="输入区县" style="min-width:140px">
                </div>
                <div class="col-auto">
                    <label class="form-label mb-0 small text-muted">分类</label>
                    <select name="categoryId" class="form-select form-select-sm" style="min-width:120px">
                        <option value="">全部分类</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${categoryId != null && categoryId.equals(cat.id)}"></option>
                    </select>
                </div>
                <div class="col-auto align-self-end">
                    <button type="submit" class="btn btn-sm btn-primary">
                        🔍 搜索
                    </button>
                    <a href="/admin/schools" class="btn btn-sm btn-outline-secondary">
                        🔄 重置
                    </a>
                </div>
            </form>
            <div class="col-auto align-self-end ms-auto">
                <form th:action="@{/admin/schools/import-from-qrcode}" method="post" class="d-inline me-1">
                    <button type="submit" class="btn btn-sm btn-outline-success">
                        📥 从活码导入学校
                    </button>
                </form>
                <form th:action="@{/admin/schools/sync-status}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-info">
                        🔄 同步活码状态
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Batch action bar (hidden by default) -->
    <div id="batchBar" class="alert alert-info d-flex align-items-center mb-2" style="display:none !important">
        <span class="me-3">已选 <strong id="selectedCount">0</strong> 所学校</span>
        <select id="batchCategoryId" class="form-select form-select-sm me-2" style="width:auto">
            <option value="">选择分类...</option>
            <option value="__clear__">清除分类（设为空）</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
        </select>
        <button type="button" id="batchAssignBtn" class="btn btn-sm btn-primary me-1">应用</button>
        <button type="button" id="batchClearBtn" class="btn btn-sm btn-outline-secondary">取消选择</button>
        <input type="hidden" id="csrfHeader" th:value="${_csrf.headerName}">
        <input type="hidden" id="csrfToken" th:value="${_csrf.token}">
    </div>

    <!-- Schools table -->
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width:40px"><input type="checkbox" id="selectAll" title="全选"></th>
                        <th>学校ID</th>
                        <th>名称</th>
                        <th>市州</th>
                        <th>区县</th>
                        <th>分类</th>
                        <th>有活码</th>
                        <th>查看</th>
                        <th>下载</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${schools.content}">
                        <td><input type="checkbox" class="school-checkbox" th:value="${s.id}"></td>
                        <td><code th:text="${s.schoolId}"></code></td>
                        <td th:text="${s.schoolName}"></td>
                        <td th:text="${s.regionCity}"></td>
                        <td th:text="${s.regionDistrict}"></td>
                        <td>
                            <span th:if="${s.categoryId}" th:text="${categoryMap.get(s.categoryId)}"></span>
                            <span th:unless="${s.categoryId}" class="text-muted">—</span>
                        </td>
                        <td>
                            <span th:if="${s.hasQrcode}" class="badge bg-success">是</span>
                            <span th:unless="${s.hasQrcode}" class="badge bg-secondary">否</span>
                        </td>
                        <td th:with="stat=${statsMap.get(s.id)}">
                            <span th:text="${stat != null ? stat[0] : 0}">0</span>
                        </td>
                        <td th:with="stat=${statsMap.get(s.id)}">
                            <span th:text="${stat != null ? stat[1] : 0}">0</span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-secondary me-1"
                                    data-bs-toggle="modal" data-bs-target="#editModal"
                                    th:data-id="${s.id}" th:data-school-id="${s.schoolId}"
                                    th:data-name="${s.schoolName}" th:data-city="${s.regionCity}"
                                    th:data-district="${s.regionDistrict}" th:data-has-qrcode="${s.hasQrcode}"
                                    th:data-category-id="${s.categoryId}">✏️ 编辑</button>
                            <form th:action="@{/admin/schools/{id}/delete(id=${s.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('确定删除该学校？')">
                                <input type="hidden" name="keyword" th:value="${keyword}">
                                <input type="hidden" name="city" th:value="${city}">
                                <input type="hidden" name="district" th:value="${district}">
                                <input type="hidden" name="filterCatId" th:value="${categoryId}">
                                <input type="hidden" name="page" th:value="${schools.number}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">🗑️ 删除</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${schools.content.isEmpty()}">
                        <td colspan="10" class="text-center text-muted py-4">
                            📦 暂无学校数据
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${schools.totalPages > 0}" class="card-footer d-flex justify-content-between align-items-center">
            <span class="text-muted small">
                共 <strong th:text="${schools.totalElements}"></strong> 条，
                第 <strong th:text="${schools.number + 1}"></strong> / <strong th:text="${schools.totalPages}"></strong> 页
            </span>
            <nav th:if="${schools.totalPages > 1}">
                <ul class="pagination pagination-sm mb-0">
                    <!-- 首页 -->
                    <li class="page-item" th:classappend="${schools.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/schools(keyword=${keyword}, city=${city}, district=${district}, categoryId=${categoryId}, page=0)}">&laquo;&laquo;</a>
                    </li>
                    <!-- 上一页 -->
                    <li class="page-item" th:classappend="${schools.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/schools(keyword=${keyword}, city=${city}, district=${district}, categoryId=${categoryId}, page=${schools.number - 1})}">&laquo;</a>
                    </li>
                    <!-- 前省略号 -->
                    <li th:if="${pageStart > 0}" class="page-item disabled"><span class="page-link">…</span></li>
                    <!-- 页码 -->
                    <li th:each="i : ${pageNumbers}" class="page-item"
                        th:classappend="${i == schools.number} ? 'active'">
                        <a class="page-link" th:text="${i + 1}"
                           th:href="@{/admin/schools(keyword=${keyword}, city=${city}, district=${district}, categoryId=${categoryId}, page=${i})}"></a>
                    </li>
                    <!-- 后省略号 -->
                    <li th:if="${pageEnd < schools.totalPages - 1}" class="page-item disabled"><span class="page-link">…</span></li>
                    <!-- 下一页 -->
                    <li class="page-item" th:classappend="${schools.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/schools(keyword=${keyword}, city=${city}, district=${district}, categoryId=${categoryId}, page=${schools.number + 1})}">&raquo;</a>
                    </li>
                    <!-- 末页 -->
                    <li class="page-item" th:classappend="${schools.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/schools(keyword=${keyword}, city=${city}, district=${district}, categoryId=${categoryId}, page=${schools.totalPages - 1})}">&raquo;&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/schools/save}" method="post">
                    <input type="hidden" name="keyword" th:value="${keyword}">
                    <input type="hidden" name="city" th:value="${city}">
                    <input type="hidden" name="district" th:value="${district}">
                    <input type="hidden" name="filterCatId" th:value="${categoryId}">
                    <input type="hidden" name="page" th:value="${schools.number}">
                    <div class="modal-header">
                        <h5 class="modal-title">➕ 新增学校</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">学校ID <span class="text-danger">*</span></label>
                            <input type="text" name="schoolId" class="form-control" required
                                   placeholder="如：420100001">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">学校名称 <span class="text-danger">*</span></label>
                            <input type="text" name="schoolName" class="form-control" required
                                   placeholder="如：武汉市第一中学">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">市州 <span class="text-danger">*</span></label>
                            <input type="text" name="regionCity" class="form-control" required
                                   placeholder="如：武汉市">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">区县 <span class="text-danger">*</span></label>
                            <input type="text" name="regionDistrict" class="form-control" required
                                   placeholder="如：武昌区">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">分类</label>
                            <select name="categoryId" class="form-select">
                                <option value="">未分类</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}"
                                        th:text="${cat.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="editForm" th:action="@{/admin/schools/save}" method="post">
                    <input type="hidden" name="keyword" th:value="${keyword}">
                    <input type="hidden" name="city" th:value="${city}">
                    <input type="hidden" name="district" th:value="${district}">
                    <input type="hidden" name="filterCatId" th:value="${categoryId}">
                    <input type="hidden" name="page" th:value="${schools.number}">
                    <div class="modal-header">
                        <h5 class="modal-title">✏️ 编辑学校</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" name="id" id="editId">
                        <input type="hidden" name="hasQrcode" id="editHasQrcode" value="false">
                        <div class="mb-3">
                            <label class="form-label">学校ID <span class="text-danger">*</span></label>
                            <input type="text" name="schoolId" id="editSchoolId" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">学校名称 <span class="text-danger">*</span></label>
                            <input type="text" name="schoolName" id="editName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">市州 <span class="text-danger">*</span></label>
                            <input type="text" name="regionCity" id="editCity" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">区县 <span class="text-danger">*</span></label>
                            <input type="text" name="regionDistrict" id="editDistrict" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">分类</label>
                            <select name="categoryId" id="editCategoryId" class="form-select">
                                <option value="">未分类</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}"
                                        th:text="${cat.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Import CSV Modal -->
    <div class="modal fade" id="importModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/schools/import}" method="post" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title">📤 CSV 批量导入学校</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="text-muted small">
                            ℹ️
                            格式：<code>school_id,school_name,region_city,region_district[,category_name]</code>（含表头行）
                        </p>
                        <input type="file" name="file" accept=".csv,.txt" class="form-control" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary">
                            📤 导入
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

<script>
// Populate edit modal from button data attributes
var editModal = document.getElementById('editModal');
if (editModal) {
    editModal.addEventListener('show.bs.modal', function(e) {
        var btn = e.relatedTarget;
        document.getElementById('editId').value = btn.getAttribute('data-id');
        document.getElementById('editSchoolId').value = btn.getAttribute('data-school-id');
        document.getElementById('editName').value = btn.getAttribute('data-name');
        document.getElementById('editCity').value = btn.getAttribute('data-city');
        document.getElementById('editDistrict').value = btn.getAttribute('data-district');
        document.getElementById('editHasQrcode').value = btn.getAttribute('data-has-qrcode');
        var catId = btn.getAttribute('data-category-id');
        document.getElementById('editCategoryId').value = catId || '';
    });
}

// ── Batch category assignment ──
(function() {
    var selectAll = document.getElementById('selectAll');
    var checkboxes = document.querySelectorAll('.school-checkbox');
    var batchBar = document.getElementById('batchBar');
    var selectedCount = document.getElementById('selectedCount');
    var batchCategoryId = document.getElementById('batchCategoryId');
    var batchAssignBtn = document.getElementById('batchAssignBtn');
    var batchClearBtn = document.getElementById('batchClearBtn');

    function getChecked() {
        return document.querySelectorAll('.school-checkbox:checked');
    }

    function updateUI() {
        var checked = getChecked();
        var count = checked.length;
        selectedCount.textContent = count;
        batchBar.style.display = count > 0 ? '' : 'none';
        if (selectAll) {
            var total = document.querySelectorAll('.school-checkbox').length;
            selectAll.indeterminate = count > 0 && count < total;
            selectAll.checked = count === total;
        }
    }

    if (selectAll) {
        selectAll.addEventListener('change', function() {
            document.querySelectorAll('.school-checkbox').forEach(function(cb) {
                cb.checked = selectAll.checked;
            });
            updateUI();
        });
    }

    checkboxes.forEach(function(cb) {
        cb.addEventListener('change', updateUI);
    });

    if (batchClearBtn) {
        batchClearBtn.addEventListener('click', function() {
            checkboxes.forEach(function(cb) { cb.checked = false; });
            updateUI();
        });
    }

    if (batchAssignBtn) {
        batchAssignBtn.addEventListener('click', function() {
            var catId = batchCategoryId.value;
            if (!catId) {
                alert('请选择目标分类');
                return;
            }
            var ids = [];
            getChecked().forEach(function(cb) { ids.push(cb.value); });
            if (ids.length === 0) return;

            var clearMode = catId === '__clear__';
            if (!clearMode && !confirm('确定将选中的 ' + ids.length + ' 所学校批量设置分类？')) return;

            var formData = new URLSearchParams();
            if (!clearMode) {
                formData.append('categoryId', catId);
            }
            ids.forEach(function(id) { formData.append('schoolIds', id); });

            fetch('/admin/categories/batch-assign', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    [document.getElementById('csrfHeader').value]: document.getElementById('csrfToken').value
                },
                body: formData
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.ok) {
                    var msg = clearMode
                        ? '已清除 ' + data.count + ' 所学校的分类'
                        : '已为 ' + data.count + ' 所学校设置分类';
                    alert(msg);
                    location.reload();
                } else {
                    alert('操作失败');
                }
            })
            .catch(function() {
                alert('请求失败，请重试');
            });
        });
    }

    // Initialize on page load
    updateUI();
})();
</script>
</div>
</body>
</html>
