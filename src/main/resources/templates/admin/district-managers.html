<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN"
      th:replace="~{layout :: layout(title='区县负责人配置', content=~{::#content})}">
<body>
<div id="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">👤 区县负责人配置</h4>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">
            ➕ 新增配置
        </button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>城市</th>
                        <th>区县</th>
                        <th>负责人</th>
                        <th>负责人 UserID</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${managers}">
                        <td th:text="${m.id}"></td>
                        <td th:text="${m.regionCity}"></td>
                        <td th:text="${m.regionDistrict}"></td>
                        <td th:text="${m.managerName}"></td>
                        <td><code th:text="${m.managerUserid}"></code></td>
                        <td>
                            <button class="btn btn-sm btn-outline-secondary me-1"
                                    data-bs-toggle="modal" data-bs-target="#editModal"
                                    th:attr="data-id=${m.id},data-userid=${m.managerUserid}">✏️ 编辑</button>
                            <form th:action="@{'/admin/district-managers/' + ${m.id} + '/delete'}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('确认删除该区县负责人配置？')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">🗑️ 删除</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="text-center py-4" th:if="${managers.isEmpty()}">
            <p class="text-muted">暂无区县负责人配置</p>
        </div>
    </div>

    <!-- 新增模态框 -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <form th:action="@{/admin/district-managers/create}" method="post" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">新增区县负责人</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">城市</label>
                        <div class="combo-box position-relative">
                            <input type="text" class="form-control combo-input pe-5"
                                   placeholder="点击选择或输入搜索…" autocomplete="off">
                            <span class="position-absolute top-50 end-0 translate-middle-y me-2 text-muted combo-arrow"
                               style="pointer-events:none;z-index:5;">▼</span>
                            <select name="regionCity" class="d-none" required>
                                <option value="">请选择城市</option>
                                <option th:each="c : ${cities}" th:value="${c}" th:text="${c}"></option>
                            </select>
                            <div class="combo-dropdown position-absolute bg-white border rounded shadow-sm"
                                 style="z-index:1060;max-height:200px;overflow-y:auto;display:none;"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">区县</label>
                        <div class="combo-box position-relative">
                            <input type="text" class="form-control combo-input pe-5"
                                   placeholder="点击选择或输入搜索…" autocomplete="off">
                            <span class="position-absolute top-50 end-0 translate-middle-y me-2 text-muted combo-arrow"
                               style="pointer-events:none;z-index:5;">▼</span>
                            <select name="regionDistrict" class="d-none" required>
                                <option value="">请选择区县</option>
                                <option th:each="d : ${districts}" th:value="${d}" th:text="${d}"></option>
                            </select>
                            <div class="combo-dropdown position-absolute bg-white border rounded shadow-sm"
                                 style="z-index:1060;max-height:200px;overflow-y:auto;display:none;"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">负责人</label>
                        <div class="combo-box position-relative">
                            <input type="text" class="form-control combo-input pe-5"
                                   placeholder="点击选择或输入姓名搜索…" autocomplete="off">
                            <span class="position-absolute top-50 end-0 translate-middle-y me-2 text-muted combo-arrow"
                               style="pointer-events:none;z-index:5;">▼</span>
                            <select name="managerUserid" class="d-none" required>
                                <option value="">请选择负责人</option>
                                <option th:each="e : ${employeeList}" th:value="${e.userid}"
                                        th:text="${e.name + ' (' + e.userid + ')'}"></option>
                            </select>
                            <div class="combo-dropdown position-absolute bg-white border rounded shadow-sm"
                                 style="z-index:1060;max-height:200px;overflow-y:auto;display:none;"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">确认添加</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <form th:action="@{/admin/district-managers/{id}/update(id='')}" method="post"
                  class="modal-content" id="editForm">
                <div class="modal-header">
                    <h5 class="modal-title">编辑区县负责人</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">负责人</label>
                        <div class="combo-box position-relative">
                            <input type="text" class="form-control combo-input pe-5"
                                   placeholder="点击选择或输入姓名搜索…" autocomplete="off">
                            <span class="position-absolute top-50 end-0 translate-middle-y me-2 text-muted combo-arrow"
                               style="pointer-events:none;z-index:5;">▼</span>
                            <select name="managerUserid" class="d-none" required>
                                <option value="">请选择负责人</option>
                                <option th:each="e : ${employeeList}" th:value="${e.userid}"
                                        th:text="${e.name + ' (' + e.userid + ')'}"></option>
                            </select>
                            <div class="combo-dropdown position-absolute bg-white border rounded shadow-sm"
                                 style="z-index:1060;max-height:200px;overflow-y:auto;display:none;"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">确认更新</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
