<!DOCTYPE html>
<!-- 员工管理页面 — 全局员工池全景视图，按状态分组展示每位员工的日用量和所在活码 -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='员工管理', content=~{::main})}">
<main>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>全局员工池</h4>
        <div>
            <span class="badge bg-success fs-6" th:text="'待命 ' + ${standbyCount}"></span>
            <span class="badge bg-warning text-dark fs-6" th:text="'已满 ' + ${fullCount}"></span>
            <span class="badge bg-danger fs-6" th:text="'暂停 ' + ${blockedCount}"></span>
        </div>
    </div>

    <!-- 状态分布条 -->
    <div class="card p-3 mb-3" th:if="${!poolEntries.isEmpty()}">
        <div class="progress" style="height: 24px;">
            <div class="progress-bar bg-success" th:style="'width:' + (${standbyCount * 100 / poolEntries.size()}) + '%'" th:text="${standbyCount > 0 ? '待命 ' + standbyCount : ''}"></div>
            <div class="progress-bar bg-warning text-dark" th:style="'width:' + (${fullCount * 100 / poolEntries.size()}) + '%'" th:text="${fullCount > 0 ? '已满 ' + fullCount : ''}"></div>
            <div class="progress-bar bg-danger" th:style="'width:' + (${blockedCount * 100 / poolEntries.size()}) + '%'" th:text="${blockedCount > 0 ? '暂停 ' + blockedCount : ''}"></div>
        </div>
    </div>

    <!-- 全局池表格 -->
    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0" th:if="${!poolEntries.isEmpty()}">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>员工账号</th>
                        <th>日用量</th>
                        <th>日上限</th>
                        <th>使用率</th>
                        <th>优先级</th>
                        <th>状态</th>
                        <th>所在活码</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p,iter : ${poolEntries}">
                        <!-- 行号 -->
                        <td class="text-muted small" th:text="${iter.count}"></td>
                        <!-- 员工账号 -->
                        <td>
                            <code th:text="${p.agentUserid}"></code>
                        </td>
                        <!-- 今日接待量 -->
                        <td>
                            <span th:text="${p.dailyCurrent}" th:classappend="${p.dailyCurrent >= p.dailyMax ? 'text-danger fw-bold' : ''}"></span>
                        </td>
                        <!-- 日上限 -->
                        <td th:text="${p.dailyMax}"></td>
                        <!-- 使用率进度条 -->
                        <td style="min-width: 100px;">
                            <div class="progress" style="height: 16px;" th:with="pct=${p.dailyMax > 0 ? p.dailyCurrent * 100 / p.dailyMax : 0}">
                                <div class="progress-bar"
                                     th:classappend="${pct >= 100 ? 'bg-danger' : (pct >= 80 ? 'bg-warning' : 'bg-success')}"
                                     th:style="'width:' + ${pct} + '%'"
                                     th:text="${pct + '%'}"></div>
                            </div>
                        </td>
                        <!-- 优先级 -->
                        <td><span class="badge bg-light text-dark" th:text="'#' + ${p.sortOrder}"></span></td>
                        <!-- 状态 -->
                        <td>
                            <span class="badge" th:classappend="${p.status.name() == 'standby' ? 'bg-success' : (p.status.name() == 'full' ? 'bg-warning text-dark' : 'bg-danger')}"
                                  th:text="${p.status.name() == 'standby' ? '待命' : (p.status.name() == 'full' ? '已满' : '暂停')}"></span>
                        </td>
                        <!-- 所在活码列表 -->
                        <td>
                            <span th:each="name,stat : ${agentQrNames.getOrDefault(p.agentUserid, {})}"
                                  class="badge bg-light text-dark me-1" th:text="${name}"></span>
                            <span th:if="${agentQrNames.getOrDefault(p.agentUserid, {}).isEmpty()}" class="text-muted small">-</span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 空池提示 -->
            <div th:if="${poolEntries.isEmpty()}" class="text-center text-muted py-4">
                <p class="mb-2">全局员工池为空</p>
                <small>请先在活码详情页中将员工加入全局池，或通过企业微信通讯录同步导入</small>
            </div>
        </div>
    </div>

    <!-- 说明 -->
    <small class="text-muted mt-2 d-block">
        💡 全局池员工在所有活码间共享。员工被任一活码添加后，其日用量全局累计。
        达到日上限后状态变为「已满」，午夜自动恢复并排到队尾。
    </small>
</main>
</html>
