<!DOCTYPE html>
<!-- 客户管理页面 — 查看所有客户列表，支持搜索、筛选、分页，以及快速添加测试客户 -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='客户管理', content=~{::main})}">
<main>
    <!-- 页面标题与工具栏 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- 标题区：显示累计客户数和今日新增数 -->
        <h4 class="mb-0">
            客户管理
            <small class="text-muted fs-6 ms-2">
                累计 <span th:text="${total}">0</span> 人 | 今日新增 <span th:text="${todayCount}" class="text-success">0</span> 人
            </small>
        </h4>
        <!-- 操作按钮组 -->
        <div class="btn-group">
            <button class="btn btn-outline-success btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#testCustomerForm">
                ➕ 快速添加测试客户
            </button>
            <form method="post" th:action="@{/customers/sync-agent-names}" style="display:inline">
                <button type="submit" class="btn btn-outline-secondary btn-sm">🔄 同步员工姓名</button>
            </form>
            <form method="post" th:action="@{/customers/repair-data}" style="display:inline">
                <button type="submit" class="btn btn-outline-warning btn-sm">🔧 修复客户数据</button>
            </form>
            <a href="/customers/export" class="btn btn-outline-secondary btn-sm">📥 导出 CSV</a>
        </div>
    </div>

    <!-- 测试客户快速添加表单（可折叠） -->
    <div class="collapse card p-3 mb-3 bg-light" id="testCustomerForm">
        <form method="post" th:action="@{/customers/create-test}" class="row g-2 align-items-end">
            <!-- 字段：客户昵称 -->
            <div class="col-md-2">
                <label class="form-label small">客户昵称</label>
                <input type="text" name="name" class="form-control form-control-sm" value="测试家长" required>
            </div>
            <!-- 字段：接待员企微账号，通过 th:each 遍历所有员工生成选项 -->
            <div class="col-md-2">
                <label class="form-label small">接待员企微账号</label>
                <select name="agentUserid" class="form-select form-select-sm" required>
                    <option value="">请选择...</option>
                    <option th:each="a : ${agents}"
                            th:value="${a.userid}"
                            th:text="${a.name + ' (' + a.userid + ')'}"></option>
                </select>
            </div>
            <!-- 字段：关联活码 -->
            <div class="col-md-2">
                <label class="form-label small">关联活码</label>
                <select name="qrCodeId" class="form-select form-select-sm">
                    <option value="">不关联</option>
                    <option th:each="q : ${qrCodes}"
                            th:value="${q.id}"
                            th:text="${q.schoolName + ' (ID:' + q.id + ')'}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success btn-sm">创建测试客户</button>
                <small class="text-muted d-block">仅用于本地开发调试</small>
            </div>
        </form>
    </div>

    <!-- 搜索筛选栏 -->
    <div class="card p-3 mb-3">
        <form class="row g-2" method="get" th:action="@{/customers}">
            <!-- 关键词搜索（昵称/手机号） -->
            <div class="col-md-3">
                <input type="text" name="keyword" class="form-control" placeholder="搜索昵称/手机"
                       th:value="${keyword}">
            </div>
            <!-- 学校筛选（待实现选项） -->
            <div class="col-md-2">
                <select name="schoolId" class="form-select">
                    <option value="">全部学校</option>
                </select>
            </div>
            <!-- 状态筛选 -->
            <div class="col-md-2">
                <select name="status" class="form-select">
                    <option value="">全部状态</option>
                    <option value="active" th:selected="${status == 'active'}">活跃</option>
                    <option value="deleted" th:selected="${status == 'deleted'}">已删除</option>
                </select>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-outline-secondary w-100"><i class="bi bi-search"></i></button>
            </div>
        </form>
    </div>

    <!-- 数据表格 -->
    <div class="card p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <!-- 表头 -->
                <thead class="table-light">
                    <tr>
                        <th>客户昵称</th>
                        <th>添加时间</th>
                        <th>接待员</th>
                        <th>服务老师</th>
                        <th>学校ID</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <!-- 表体：th:each 遍历分页数据 customers.content，每行一个客户 -->
                <tbody>
                    <tr th:each="c : ${customers.content}">
                        <td>
                            <!-- 点击昵称跳转客户详情页 -->
                            <a th:href="@{/customers/{id}(id=${c.id})}" class="text-decoration-none fw-semibold"
                               th:text="${c.name}">昵称</a>
                        </td>
                        <!-- 添加时间，为空时显示"-" -->
                        <td th:text="${c.addTime != null ? #temporals.format(c.addTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <!-- 接待员名称，通过 agentNameMap 转换 userid 为可读名称 -->
                        <td th:text="${agentNameMap.getOrDefault(c.addedAgent, c.addedAgent ?: '-')}"></td>
                        <!-- 当前服务老师 -->
                        <td th:text="${agentNameMap.getOrDefault(c.currentAgent, c.currentAgent ?: '-')}"></td>
                        <!-- 学校名称，通过 schoolNameMap 转换 -->
                        <td th:text="${schoolNameMap.getOrDefault(c.schoolId, c.schoolId ?: '-')}"></td>
                        <!-- 状态徽标：活跃为绿色，已删除为灰色 -->
                        <td>
                            <span class="badge" th:classappend="${c.status.name() == 'active' ? 'bg-success' : 'bg-secondary'}"
                                  th:text="${c.status.name() == 'active' ? '活跃' : '已删除'}"></span>
                        </td>
                        <td>
                            <a th:href="@{/customers/{id}(id=${c.id})}" class="btn btn-sm btn-outline-secondary">详情</a>
                        </td>
                    </tr>
                    <!-- 空数据提示 -->
                    <tr th:if="${customers.content.isEmpty()}">
                        <td colspan="7" class="text-center text-muted py-4">暂无客户数据</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 分页导航，仅当总页数大于 1 时显示 -->
    <nav th:if="${customers.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <!-- 上一页按钮，首页时禁用 -->
            <li class="page-item" th:classappend="${customers.first ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/customers(keyword=${keyword},schoolId=${schoolId},status=${status},page=${customers.number - 1})}">上一页</a>
            </li>
            <!-- 页码信息：当前页 / 总页数 -->
            <li class="page-item disabled">
                <span class="page-link" th:text="'第 ' + ${customers.number + 1} + ' / ' + ${customers.totalPages} + ' 页'"></span>
            </li>
            <!-- 下一页按钮，末页时禁用 -->
            <li class="page-item" th:classappend="${customers.last ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/customers(keyword=${keyword},schoolId=${schoolId},status=${status},page=${customers.number + 1})}">下一页</a>
            </li>
        </ul>
    </nav>
</main>
</html>
