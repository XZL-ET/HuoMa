<!DOCTYPE html>
<!-- 客户管理页面 — 查看所有客户列表，支持搜索、筛选、分页，以及快速添加测试客户 -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='客户管理', content=~{::main})}">
<main>
    <!-- 页面标题与工具栏 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- 标题区：显示累计客户数和今日新增数 -->
        <h4 class="mb-0">
            客户管理
            <small class="text-muted fs-6 ms-2">
                累计 <span th:text="${total}">0</span> 人 | 今日新增 <span th:text="${todayCount}" class="text-success">0</span> 人
            </small>
        </h4>
        <!-- 操作按钮组 -->
        <div class="btn-group">
            <button class="btn btn-outline-success btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#testCustomerForm">
                ➕ 快速添加测试客户
            </button>
            <form method="post" th:action="@{/customers/sync-agent-names}" style="display:inline"
                  onsubmit="this.querySelector('button').disabled=true;this.querySelector('button').textContent='同步中...'">
                <button type="submit" class="btn btn-outline-secondary btn-sm">🔄 同步员工姓名</button>
            </form>
            <form method="post" th:action="@{/customers/repair-data}" style="display:inline"
                  onsubmit="this.querySelector('button').disabled=true;this.querySelector('button').textContent='修复中...'">
                <button type="submit" class="btn btn-outline-warning btn-sm">🔧 修复客户数据</button>
            </form>
            <a th:href="@{/customers/export(keyword=${keyword},schoolId=${schoolId},currentAgent=${currentAgent},status=${status},startTime=${startTime},endTime=${endTime})}" class="btn btn-outline-secondary btn-sm">📥 导出 CSV</a>
        </div>
    </div>

    <!-- 测试客户快速添加表单（可折叠） -->
    <div class="collapse card p-3 mb-3 bg-light" id="testCustomerForm">
        <form method="post" th:action="@{/customers/create-test}" class="row g-2 align-items-end">
            <!-- 字段：客户昵称 -->
            <div class="col-md-2">
                <label class="form-label small">客户昵称</label>
                <input type="text" name="name" class="form-control form-control-sm" value="测试家长" required>
            </div>
            <!-- 字段：接待员企微账号，通过 th:each 遍历所有员工生成选项 -->
            <div class="col-md-2">
                <label class="form-label small">接待员企微账号</label>
                <select name="agentUserid" class="form-select form-select-sm" required>
                    <option value="">请选择...</option>
                    <option th:each="a : ${agents}"
                            th:value="${a.userid}"
                            th:text="${a.name + ' (' + a.userid + ')'}"></option>
                </select>
            </div>
            <!-- 字段：关联活码 -->
            <div class="col-md-2">
                <label class="form-label small">关联活码</label>
                <select name="qrCodeId" class="form-select form-select-sm">
                    <option value="">不关联</option>
                    <option th:each="q : ${qrCodes}"
                            th:value="${q.id}"
                            th:text="${q.schoolName + ' (ID:' + q.id + ')'}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success btn-sm">创建测试客户</button>
                <small class="text-muted d-block">仅用于本地开发调试</small>
            </div>
        </form>
    </div>

    <!-- 搜索筛选栏 -->
    <div class="card p-3 mb-3">
        <form class="row g-2" method="get" th:action="@{/customers}">
            <!-- 关键词搜索（昵称/手机号） -->
            <div class="col-md-2">
                <input type="text" name="keyword" class="form-control" placeholder="搜索昵称/手机"
                       th:value="${keyword}">
            </div>
            <!-- 学校筛选：可输入搜索也可下拉选择 -->
            <div class="col-md-2">
                <input type="text" name="schoolId" class="form-control" list="schoolList"
                       placeholder="搜索学校..." th:value="${schoolDisplay}" autocomplete="off">
                <datalist id="schoolList">
                    <option th:each="q : ${qrCodes}"
                            th:value="${q.schoolId}"
                            th:text="${q.schoolName + ' (' + q.schoolId + ')'}"></option>
                </datalist>
            </div>
            <!-- 接待人筛选：可输入搜索也可下拉选择 -->
            <div class="col-md-2">
                <input type="text" name="currentAgent" class="form-control" list="agentList"
                       placeholder="搜索接待人..." th:value="${agentDisplay}" autocomplete="off">
                <datalist id="agentList">
                    <option th:each="a : ${agents}"
                            th:value="${a.userid}"
                            th:text="${a.name + ' (' + a.userid + ')'}"></option>
                </datalist>
            </div>
            <!-- 状态筛选 -->
            <div class="col-md-1">
                <select name="status" class="form-select">
                    <option value="">全部状态</option>
                    <option value="active" th:selected="${status == 'active'}">活跃</option>
                    <option value="deleted" th:selected="${status == 'deleted'}">已删除</option>
                </select>
            </div>
            <!-- 时间范围筛选 -->
            <div class="col-md-2">
                <input type="datetime-local" name="startTime" class="form-control form-control-sm"
                       th:value="${startTime != null ? #temporals.format(startTime, 'yyyy-MM-dd''T''HH:mm') : ''}"
                       placeholder="开始时间">
            </div>
            <div class="col-md-2">
                <input type="datetime-local" name="endTime" class="form-control form-control-sm"
                       th:value="${endTime != null ? #temporals.format(endTime, 'yyyy-MM-dd''T''HH:mm') : ''}"
                       placeholder="结束时间">
            </div>
            <div class="col-md-auto">
                <button type="submit" class="btn btn-primary">🔍 搜索</button>
            </div>
        </form>
    </div>

    <!-- 数据表格 -->
    <div class="card p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <!-- 表头 -->
                <thead class="table-light">
                    <tr>
                        <th>客户昵称</th>
                        <th>添加时间</th>
                        <th>接待员</th>
                        <th>服务老师</th>
                        <th>学校ID</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <!-- 表体：th:each 遍历分页数据 customers.content，每行一个客户 -->
                <tbody>
                    <tr th:each="c : ${customers.content}">
                        <td>
                            <!-- 点击昵称跳转客户详情页 -->
                            <a th:href="@{/customers/{id}(id=${c.id})}" class="text-decoration-none fw-semibold"
                               th:text="${c.name}">昵称</a>
                        </td>
                        <!-- 添加时间，为空时显示"-" -->
                        <td th:text="${c.addTime != null ? #temporals.format(c.addTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <!-- 接待员名称，通过 agentNameMap 转换 userid 为可读名称 -->
                        <td th:text="${agentNameMap.getOrDefault(c.addedAgent, c.addedAgent ?: '-')}"></td>
                        <!-- 当前服务老师 -->
                        <td th:text="${agentNameMap.getOrDefault(c.currentAgent, c.currentAgent ?: '-')}"></td>
                        <!-- 学校名称，通过 schoolNameMap 转换 -->
                        <td th:text="${schoolNameMap.getOrDefault(c.schoolId, c.schoolId ?: '-')}"></td>
                        <!-- 状态徽标：活跃为绿色，已删除为灰色；增加 null 防护 -->
                        <td>
                            <span class="badge"
                                  th:classappend="${c.status != null && c.status.name() == 'active' ? 'bg-success' : 'bg-secondary'}"
                                  th:text="${c.status != null ? (c.status.name() == 'active' ? '活跃' : '已删除') : '未知'}"></span>
                        </td>
                        <td>
                            <a th:href="@{/customers/{id}(id=${c.id})}" class="btn btn-sm btn-outline-secondary">详情</a>
                        </td>
                    </tr>
                    <!-- 空数据提示 -->
                    <tr th:if="${customers.content.isEmpty()}">
                        <td colspan="7" class="text-center text-muted py-4">暂无客户数据</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 分页导航，仅当总页数大于 1 时显示 -->
    <nav th:if="${customers.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <!-- 上一页按钮：首页时隐藏链接而非仅 disabled 样式，防止点击产生 page=-1 -->
            <li class="page-item" th:classappend="${customers.first ? 'disabled' : ''}">
                <th:block th:if="${!customers.first}">
                    <a class="page-link" th:href="@{/customers(keyword=${keyword},schoolId=${schoolId},currentAgent=${currentAgent},status=${status},startTime=${startTime},endTime=${endTime},page=${customers.number - 1})}">上一页</a>
                </th:block>
                <th:block th:if="${customers.first}">
                    <span class="page-link">上一页</span>
                </th:block>
            </li>
            <!-- 页码跳转表单：GET 提交到 /customers，携带筛选条件 + 页码 -->
            <li class="page-item">
                <form method="get" th:action="@{/customers}" class="page-link border-0 bg-transparent" style="display:inline-flex;align-items:center;gap:4px"
                      th:attr="data-max-page=${customers.totalPages}"
                      onsubmit="var v=parseInt(this.goto.value);var m=parseInt(this.getAttribute('data-max-page'));if(isNaN(v)||v<1)v=1;if(v>m)v=m;this.page.value=v-1">
                    <input type="hidden" name="keyword" th:value="${keyword}">
                    <input type="hidden" name="schoolId" th:value="${schoolId}">
                    <input type="hidden" name="currentAgent" th:value="${currentAgent}">
                    <input type="hidden" name="status" th:value="${status}">
                    <input type="hidden" name="startTime" th:value="${startTime != null ? #temporals.format(startTime, 'yyyy-MM-dd''T''HH:mm') : ''}">
                    <input type="hidden" name="endTime" th:value="${endTime != null ? #temporals.format(endTime, 'yyyy-MM-dd''T''HH:mm') : ''}">
                    <input type="hidden" name="page" value="0">
                    <span>第</span>
                    <input type="number" name="goto" min="1" th:max="${customers.totalPages}"
                           th:value="${customers.number + 1}"
                           class="form-control form-control-sm text-center"
                           style="width:55px; padding:2px 4px; height:28px;">
                    <span>/ <span th:text="${customers.totalPages}"></span> 页</span>
                    <button type="submit" class="btn btn-outline-secondary btn-sm" style="padding:2px 8px; height:28px;">跳转</button>
                </form>
                <!-- JS 禁用时的后备：纯链接方式跳页 -->
                <noscript>
                    <span class="text-muted small ms-2">（需启用 JS 跳页，或使用上一页/下一页）</span>
                </noscript>
            </li>
            <!-- 下一页按钮：末页时隐藏链接 -->
            <li class="page-item" th:classappend="${customers.last ? 'disabled' : ''}">
                <th:block th:if="${!customers.last}">
                    <a class="page-link" th:href="@{/customers(keyword=${keyword},schoolId=${schoolId},currentAgent=${currentAgent},status=${status},startTime=${startTime},endTime=${endTime},page=${customers.number + 1})}">下一页</a>
                </th:block>
                <th:block th:if="${customers.last}">
                    <span class="page-link">下一页</span>
                </th:block>
            </li>
        </ul>
    </nav>
</main>
</html>
