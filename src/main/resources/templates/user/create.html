<!DOCTYPE html>
<!-- 创建用户页面 — 仅 admin 可访问 -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='创建用户', content=~{::main})}">
<main>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>创建用户</h4>
        <a href="/users" class="btn btn-outline-secondary btn-sm">
            ← 返回列表
        </a>
    </div>

    <!-- 错误消息 -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
    </div>

    <!-- 创建表单 -->
    <div class="card">
        <div class="card-body" style="max-width: 500px;">
            <form th:action="@{/users/create}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                    <input type="text" name="username" id="username"
                           class="form-control" placeholder="登录用户名"
                           required minlength="3" maxlength="50" autofocus>
                    <small class="text-muted">3-50 个字符，英文或数字</small>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码 <span class="text-danger">*</span></label>
                    <input type="password" name="password" id="password"
                           class="form-control" placeholder="登录密码"
                           required minlength="6">
                    <small class="text-muted">至少 6 位字符</small>
                </div>
                <div class="mb-3">
                    <label for="displayName" class="form-label">显示名称 <span class="text-danger">*</span></label>
                    <input type="text" name="displayName" id="displayName"
                           class="form-control" placeholder="如：张三"
                           required maxlength="100">
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label">角色</label>
                    <select name="role" id="role" class="form-select">
                        <option value="operator">运营人员 — 管理活码/客户/员工</option>
                        <option value="admin">管理员 — 全部权限（含用户管理）</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">
                    ✓ 创建用户
                </button>
            </form>
        </div>
    </div>
</main>
</html>
