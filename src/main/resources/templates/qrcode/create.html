<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='手动创建活码', content=~{::main})}">
<main>
<style>
/* ── 可搜索员工选择面板 ── */
.employee-picker {
    border: 1px solid #dee2e6; border-radius: 8px;
    background: #fff; overflow: hidden;
}
.employee-picker .search-bar {
    padding: 8px 10px; border-bottom: 1px solid #eee;
    display: flex; align-items: center; gap: 8px;
}
.employee-picker .search-bar input {
    flex: 1; border: none; outline: none; font-size: 14px; padding: 4px 0;
}
.employee-picker .search-bar .bi-search { color: #999; }
.employee-picker .search-bar .count { font-size: 12px; color: #888; white-space: nowrap; }
.employee-picker .list {
    max-height: 220px; overflow-y: auto;
}
.employee-picker .list .row-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-bottom: 1px solid #f5f5f5;
    transition: background .1s; cursor: pointer;
}
.employee-picker .list .row-item:hover { background: #f8f9ff; }
.employee-picker .list .row-item.selected { background: #e8f0fe; }
.employee-picker .list .row-item .form-check-input { cursor: pointer; flex-shrink: 0; }
.employee-picker .list .row-item .name-col { flex: 1; min-width: 0; }
.employee-picker .list .row-item .name-col .name { font-size: 14px; font-weight: 500; }
.employee-picker .list .row-item .name-col .uid { font-size: 11px; color: #999; }
.employee-picker .list .row-item .limit-col { flex-shrink: 0; width: 100px; }
.employee-picker .list .row-item .limit-col input {
    width: 100%; text-align: center; font-size: 13px;
    border: 1px solid #dee2e6; border-radius: 4px; padding: 3px 6px;
}
.employee-picker .list .row-item .limit-col input:disabled {
    background: #f5f5f5; color: #bbb;
}
.employee-picker .list .no-result {
    padding: 20px; text-align: center; color: #999; font-size: 13px;
}
</style>

<div class="card p-4 mx-auto" style="max-width: 800px;">
    <h5 class="mb-4">手动创建活码</h5>
    <form method="post" th:action="@{/qrcodes/create}" id="createForm">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">学校名称 <span class="text-danger">*</span></label>
                <input type="text" name="schoolName" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">学校ID <span class="text-danger">*</span></label>
                <input type="text" name="schoolId" class="form-control" required
                       placeholder="唯一标识，写入企微 state">
            </div>
            <div class="col-md-6">
                <label class="form-label">市 <span class="text-danger">*</span></label>
                <input type="text" name="regionCity" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">区 <span class="text-danger">*</span></label>
                <input type="text" name="regionDistrict" class="form-control" required>
            </div>
            <div class="col-12">
                <label class="form-label">备注</label>
                <input type="text" name="remark" class="form-control">
            </div>
        </div>

        <h6 class="mb-3">员工配置</h6>
        <div th:if="${loadError}" class="alert alert-warning py-1 small mb-2" th:text="${loadError}"></div>

        <!-- 员工数据（JS 用） -->
        <script th:inline="javascript">
            /*<![CDATA[*/
            window._employeeList = /*[[${userList}]]*/ [];
            /*]]>*/
        </script>

        <div class="row g-3 mb-3">
            <!-- 服务老师 -->
            <div class="col-12">
                <label class="form-label">
                    服务老师 <span class="text-danger">*</span>
                    <small class="text-muted fw-normal">— 活码主联系人，客户扫码随机分配给其中一人</small>
                </label>
                <div id="svcPicker" class="employee-picker"></div>
                <input type="hidden" name="serviceTeacherJson" id="svcJson">
                <input type="hidden" name="serviceTeacherUserid" id="svcFallback">
            </div>

            <!-- 后备接待员 -->
            <div class="col-12">
                <label class="form-label">
                    后备接待员
                    <small class="text-muted fw-normal">— 服务老师满员后按顺序激活</small>
                </label>
                <div id="receptionistPicker" class="employee-picker"></div>
                <input type="hidden" name="agentsJson" id="receptionistJson">
            </div>

            <div class="col-md-6">
                <label class="form-label">欢迎语文案</label>
                <textarea name="welcomeText" class="form-control" rows="2"
                          placeholder="欢迎来到XX书店家校服务！..."></textarea>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 创建</button>
            <a href="/qrcodes" class="btn btn-outline-secondary">取消</a>
        </div>
    </form>
</div>

<script>
/**
 * EmployeePicker — 可搜索的员工选择面板，每人独立日上限
 *
 * 用法: new EmployeePicker(el, {
 *   items: [{userid, name}, ...],
 *   defaultDailyMax: 1000,
 *   placeholder: '搜索姓名或账号...'
 * })
 *
 * 方法: getSelected() → [{userid, name, dailyMax}, ...]
 */
class EmployeePicker {
    constructor(el, opts = {}) {
        this.el = el;
        this.items = opts.items || [];
        this.defaultDailyMax = opts.defaultDailyMax || 200;
        this.placeholder = opts.placeholder || '搜索姓名或账号...';
        this.selected = new Map(); // userid → dailyMax (int)

        this.render();
        this.bindEvents();
    }

    render(filter = '') {
        const q = filter.toLowerCase();
        const filtered = this.items.filter(it =>
            it.name.toLowerCase().includes(q) || it.userid.toLowerCase().includes(q)
        );
        const selCount = this.selected.size;

        this.el.innerHTML = `
            <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" class="search-input" placeholder="${this.placeholder}" value="${this._escape(filter)}" autocomplete="off">
                <span class="count">已选 <strong>${selCount}</strong> 人</span>
            </div>
            <div class="list">
                ${filtered.length === 0 ? '<div class="no-result">无匹配员工</div>' : filtered.map(it => {
                    const checked = this.selected.has(it.userid);
                    const dm = checked ? this.selected.get(it.userid) : this.defaultDailyMax;
                    return `<div class="row-item${checked ? ' selected' : ''}" data-userid="${it.userid}">
                        <input class="form-check-input" type="checkbox" ${checked ? 'checked' : ''}>
                        <div class="name-col">
                            <div class="name">${it.name}</div>
                            <div class="uid">${it.userid}</div>
                        </div>
                        <div class="limit-col">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text" style="font-size:11px;">日限</span>
                                <input type="number" class="form-control form-control-sm"
                                    value="${dm}" min="1" max="9999"
                                    ${checked ? '' : 'disabled'}>
                            </div>
                        </div>
                    </div>`;
                }).join('')}
            </div>`;

        // re-bind event listeners
        this.bindRowEvents();
    }

    bindEvents() {
        // Search input
        this.el.addEventListener('input', e => {
            if (e.target.classList.contains('search-input')) {
                this.render(e.target.value);
            }
        });

        // Click outside — not needed for this pattern
    }

    bindRowEvents() {
        const rows = this.el.querySelectorAll('.row-item');
        rows.forEach(row => {
            // Checkbox click
            const cb = row.querySelector('.form-check-input');
            cb.addEventListener('change', () => {
                const userid = row.dataset.userid;
                if (cb.checked) {
                    const limitInput = row.querySelector('.limit-col input');
                    this.selected.set(userid, parseInt(limitInput.value) || this.defaultDailyMax);
                } else {
                    this.selected.delete(userid);
                }
                this.render(this.el.querySelector('.search-input')?.value || '');
            });

            // Click anywhere on row toggles checkbox (but not on input)
            row.addEventListener('click', e => {
                if (e.target.tagName === 'INPUT') return; // let inputs handle themselves
                cb.checked = !cb.checked;
                cb.dispatchEvent(new Event('change'));
            });

            // Daily max change
            const limitInput = row.querySelector('.limit-col input');
            limitInput.addEventListener('change', () => {
                const userid = row.dataset.userid;
                if (this.selected.has(userid)) {
                    this.selected.set(userid, parseInt(limitInput.value) || this.defaultDailyMax);
                }
            });
            // Stop click propagation on the limit input
            limitInput.addEventListener('click', e => e.stopPropagation());
        });
    }

    _escape(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }

    /** 获取选中的员工列表 [{userid, name, dailyMax}] */
    getSelected() {
        const result = [];
        const nameMap = new Map(this.items.map(it => [it.userid, it.name]));
        this.selected.forEach((dailyMax, userid) => {
            result.push({ userid, name: nameMap.get(userid) || userid, dailyMax });
        });
        return result;
    }

    /** 重置为全部未选 */
    reset() {
        this.selected.clear();
        this.render();
    }
}

// ── 初始化 ──
document.addEventListener('DOMContentLoaded', () => {
    const employees = window._employeeList || [];
    if (employees.length === 0) return;

    // 服务老师选择器
    const svcPicker = new EmployeePicker(document.getElementById('svcPicker'), {
        items: employees,
        defaultDailyMax: 1000,
        placeholder: '搜索服务老师姓名或账号...'
    });

    // 后备接待员选择器
    const receptionistPicker = new EmployeePicker(document.getElementById('receptionistPicker'), {
        items: employees,
        defaultDailyMax: 200,
        placeholder: '搜索后备接待员姓名或账号...'
    });

    // 提交前序列化
    document.getElementById('createForm').addEventListener('submit', () => {
        // 服务老师 → JSON
        const svc = svcPicker.getSelected();
        document.getElementById('svcJson').value = svc.length > 0 ? JSON.stringify(svc) : '';
        // 逗号分隔回退（兼容）
        document.getElementById('svcFallback').value = svc.map(s => s.userid).join(',');

        // 接待员 → JSON
        const receptionist = receptionistPicker.getSelected();
        document.getElementById('receptionistJson').value = receptionist.length > 0
            ? JSON.stringify(receptionist) : '';
    });
});
</script>
</main>
</html>
