<!DOCTYPE html>
<!-- 手动创建活码页面 — 填写学校信息并选择服务老师和后备接待员，生成新的活码 -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='手动创建活码', content=~{::main})}">
<main>
<style>
/* 可搜索员工选择面板样式 */
.employee-picker {
    border: 1px solid #dee2e6; border-radius: 8px;
    background: #fff; overflow: hidden;
}
.employee-picker .search-bar {
    padding: 8px 10px; border-bottom: 1px solid #eee;
    display: flex; align-items: center; gap: 8px;
}
.employee-picker .search-bar input {
    flex: 1; border: none; outline: none; font-size: 14px; padding: 4px 0;
}
.employee-picker .search-bar .bi-search { color: #999; }
.employee-picker .search-bar .count { font-size: 12px; color: #888; white-space: nowrap; }
.employee-picker .list {
    max-height: 220px; overflow-y: auto;
    /* 始终占位滚动条宽度，防止列表高度变化时页面跳动 */
    scrollbar-gutter: stable;
}
.employee-picker .list .row-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-bottom: 1px solid #f5f5f5;
    cursor: pointer;
    /* 隔离布局影响：行显隐不触发整体重排，IME 窗口不跳 */
    contain: layout style;
}
.employee-picker .list .row-item:hover { background: #f8f9ff; }
.employee-picker .list .row-item.selected { background: #e8f0fe; }
.employee-picker .list .row-item .form-check-input { cursor: pointer; flex-shrink: 0; }
.employee-picker .list .row-item .name-col { flex: 1; min-width: 0; }
.employee-picker .list .row-item .name-col .name { font-size: 14px; font-weight: 500; }
.employee-picker .list .row-item .name-col .uid { font-size: 11px; color: #999; }
.employee-picker .list .row-item .limit-col { flex-shrink: 0; width: 100px; }
.employee-picker .list .row-item .limit-col input {
    width: 100%; text-align: center; font-size: 13px;
    border: 1px solid #dee2e6; border-radius: 4px; padding: 3px 6px;
}
.employee-picker .list .row-item .limit-col input:disabled {
    background: #f5f5f5; color: #bbb;
}
.employee-picker .list .no-result {
    padding: 20px; text-align: center; color: #999; font-size: 13px;
}

/* ── 自动补全下拉框 ── */
.autocomplete-wrapper { position: relative; }
.autocomplete-wrapper .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: #aaa; font-size: 13px; z-index: 1; pointer-events: none;
}
.autocomplete-wrapper input { padding-left: 30px; }
.autocomplete-dropdown {
    position: absolute; top: 100%; left: 0; width: 100%;
    max-height: 220px; overflow-y: auto;
    background: #fff; border: 1px solid #dee2e6;
    border-top: none; border-radius: 0 0 8px 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    z-index: 1050;
}
.autocomplete-item {
    padding: 7px 12px; cursor: pointer;
    font-size: 14px; color: #333;
    border-bottom: 1px solid #f5f5f5;
    transition: background 0.1s;
}
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover, .autocomplete-item.active {
    background: #e8f0fe;
}
.autocomplete-item mark {
    background: transparent; color: #0d6efd; font-weight: 600; padding: 0;
}
.autocomplete-empty {
    padding: 16px; text-align: center;
    color: #999; font-size: 13px;
}
</style>

<div class="card p-4 mx-auto" style="max-width: 800px;">
    <h5 class="mb-4">手动创建活码</h5>

    <form method="post" th:action="@{/qrcodes/create}" id="createForm">

        <!-- ═══════ 基本信息 ═══════ -->
        <div class="bg-light rounded p-3 mb-3">
            <h6 class="mb-3">📋 基本信息</h6>
            <div class="row g-3">
                <!-- 学校名称（必填）—— 输入时自动补全已有学校 -->
                <div class="col-md-6">
                    <label class="form-label">学校 <span class="text-danger">*</span>
                        <span class="badge bg-secondary ms-1" th:text="${schoolOptions.size()}">0</span>
                    </label>
                    <div class="autocomplete-wrapper" id="schoolAcWrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" name="schoolName" class="form-control" required
                               placeholder="输入学校名，下拉选择已有学校" autocomplete="off">
                    </div>
                </div>
                <!-- 学校 ID（自动生成，可手动修改） -->
                <div class="col-md-6">
                    <label class="form-label">学校ID <span class="text-danger">*</span>
                        <small class="text-muted fw-normal">— 自动生成，可改</small>
                    </label>
                    <div class="input-group">
                        <input type="text" name="schoolId" id="schoolIdInput" class="form-control"
                               th:value="${suggestedSchoolId}"
                               placeholder="自动生成唯一标识">
                        <button type="button" class="btn btn-outline-secondary" id="regenerateSchoolIdBtn"
                                title="重新生成">
                            🔄
                        </button>
                    </div>
                    <div class="form-text">作为企微 state 参数，用于回调时识别来源活码</div>
                </div>
                <!-- 所在城市（必填）—— 输入时自动补全已有城市 -->
                <div class="col-md-6">
                    <label class="form-label">市州 <span class="text-danger">*</span>
                        <span class="badge bg-secondary ms-1" th:text="${cityOptions.size()}">0</span>
                    </label>
                    <div class="autocomplete-wrapper" id="cityAcWrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" name="regionCity" class="form-control" required
                               placeholder="输入城市名，下拉选择已有城市" autocomplete="off">
                    </div>
                </div>
                <!-- 所在区县（必填）—— 输入时自动补全已有区县 -->
                <div class="col-md-6">
                    <label class="form-label">县区 <span class="text-danger">*</span>
                        <span class="badge bg-secondary ms-1" th:text="${districtOptions.size()}">0</span>
                    </label>
                    <div class="autocomplete-wrapper" id="districtAcWrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" name="regionDistrict" class="form-control" required
                               placeholder="输入区县名，下拉选择已有区县" autocomplete="off">
                    </div>
                </div>
                <!-- 所属部门（可搜索）—— 扩容时优先同部门取人 -->
                <div class="col-md-6">
                    <label for="deptAcInput" class="form-label">所属部门
                        <small class="text-muted fw-normal">— 选填</small>
                    </label>
                    <div class="autocomplete-wrapper" id="deptAcWrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="deptAcInput" class="form-control"
                               placeholder="搜索部门名称..." autocomplete="off">
                    </div>
                    <input type="hidden" name="departmentId" id="departmentId" value="">
                    <div class="form-text">扩容时优先从同部门取人；清空则不限制</div>
                </div>
                <!-- 备注（选填） -->
                <div class="col-md-6">
                    <label class="form-label">备注</label>
                    <input type="text" name="remark" class="form-control" placeholder="选填">
                </div>
                <!-- 收集表单模板（选填）—— 创建后也可在详情页修改 -->
                <div class="col-md-6" th:if="${!formTemplates.isEmpty()}">
                    <label class="form-label">收集表单模板
                        <small class="text-muted fw-normal">— 选填，可后续修改</small>
                    </label>
                    <select name="formTemplateId" class="form-select">
                        <option value="">不收集</option>
                        <option th:each="t : ${formTemplates}"
                                th:value="${t.id}"
                                th:text="${t.name}"></option>
                    </select>
                    <div class="form-text">客户扫码后将收到该模板的收集表单链接</div>
                </div>
            </div>
        </div>

        <!-- 加载员工数据时的错误提示 -->
        <div th:if="${loadError}" class="alert alert-warning py-1 small mb-3" th:text="${loadError}"></div>

        <!-- 将后端 userList 嵌入页面供 JS 使用 -->
        <script th:inline="javascript">
            /*<![CDATA[*/
            window._employeeList = /*[[${userList}]]*/ [];
            window._schoolOptions = /*[[${schoolOptions}]]*/ [];
            window._cityOptions = /*[[${cityOptions}]]*/ [];
            window._districtOptions = /*[[${districtOptions}]]*/ [];
            window._departmentNames = /*[[${departmentNames}]]*/ [];
            window._departmentMap = /*[[${departmentMap}]]*/ {};
            /*]]>*/
        </script>

        <!-- ═══════ 员工配置 ═══════ -->
        <div class="bg-light rounded p-3 mb-3">
            <h6 class="mb-3">👥 员工配置</h6>

            <!-- 配置行：人数 / 场景 / 预估 —— 三列等宽 -->
            <div class="row g-3 mb-3">
                <!-- 学校人数 — 自动计算所需接待员数量 -->
                <div class="col-md-4">
                    <label class="form-label">学校人数
                        <small class="text-muted fw-normal">— 每100学生配1人</small>
                    </label>
                    <input type="number" name="studentCount" id="studentCountInput"
                           class="form-control" min="1" max="99999"
                           placeholder="填入学生总人数">
                    <div class="form-text" id="agentCountPreview" style="display:none;"></div>
                </div>
                <!-- 场景选择 — 按钮组，视觉对齐输入框 -->
                <div class="col-md-4">
                    <label class="form-label">场景</label>
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" name="scene"
                               id="sceneDaily" value="daily_push" checked
                               onchange="onSceneChange()">
                        <label class="btn btn-outline-primary btn-sm" for="sceneDaily">📱 日常</label>
                        <input type="radio" class="btn-check" name="scene"
                               id="sceneParentMeeting" value="parent_meeting"
                               onchange="onSceneChange()">
                        <label class="btn btn-outline-primary btn-sm" for="sceneParentMeeting">🏫 家长会</label>
                    </div>
                    <div class="form-text">日常 20% 扫码率 | 家长会 75%</div>
                </div>
                <!-- 预估接待员数 -->
                <div class="col-md-4">
                    <label for="initialAgentCount" class="form-label">预估接待员数</label>
                    <div class="input-group">
                        <input type="number" class="form-control" id="initialAgentCount"
                               name="initialAgentCount" min="1" max="100"
                               placeholder="自动计算">
                        <span class="input-group-text bg-light text-muted small" id="agentEstimate">—</span>
                    </div>
                    <div class="form-text text-muted small" id="agentEstimateFormula"></div>
                </div>
            </div>

            <!-- 员工选择器 -->
            <div class="row g-3">
                <!-- 服务老师选择器 — 活码主联系人 -->
                <div class="col-12">
                    <label class="form-label">
                        服务老师 <span class="text-danger">*</span>
                        <small class="text-muted fw-normal">— 客户扫码随机分配给其中一人</small>
                    </label>
                    <div id="svcPicker" class="employee-picker"></div>
                    <input type="hidden" name="serviceTeacherJson" id="svcJson">
                    <input type="hidden" name="serviceTeacherUserid" id="svcFallback">
                </div>

                <!-- 后备接待员选择器 — 满员后按序激活 -->
                <div class="col-12">
                    <label class="form-label">
                        后备接待员
                        <small class="text-muted fw-normal">— 服务老师满员后按序激活</small>
                    </label>
                    <div id="receptionistPicker" class="employee-picker"></div>
                    <input type="hidden" name="agentsJson" id="receptionistJson">
                </div>
            </div>
        </div>

        <!-- 创建失败错误提示（紧贴提交按钮上方，点击时一定可见） -->
        <div id="createError" class="alert alert-danger d-none py-2 mb-2" role="alert"></div>

        <!-- 提交按钮 -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">✓ 创建</button>
            <a href="/qrcodes" class="btn btn-outline-secondary">✕ 取消</a>
        </div>
    </form>
</div>

<script>
/**
 * EmployeePicker — 可搜索的员工选择面板，支持每人独立设置日添加上限
 *
 * 用法: new EmployeePicker(el, {
 *   items: [{userid, name}, ...],
 *   defaultDailyMax: 30,
 *   placeholder: '搜索姓名或账号...'
 * })
 *
 * 方法: getSelected() → [{userid, name, dailyMax}, ...]
 */
class EmployeePicker {
    constructor(el, opts = {}) {
        this.el = el;
        this.items = opts.items || [];
        this.defaultDailyMax = opts.defaultDailyMax || 100;
        this.placeholder = opts.placeholder || '搜索姓名或账号...';
        this.selected = new Map(); // key=userid, value=dailyMax

        this.buildAll();
        this.bindEvents();
    }

    /** 一次性构建全部 DOM：搜索栏 + 全部员工行（不再销毁重建） */
    buildAll() {
        const selCount = this.selected.size;
        this.el.innerHTML = `
            <div class="search-bar">
                🔍
                <input type="text" class="search-input" placeholder="${this.placeholder}" autocomplete="off">
                <span class="count">已选 <strong>${selCount}</strong> / ${this.items.length} 人</span>
            </div>
            <div class="list">
                ${this.items.length === 0 ? '<div class="no-result">暂无员工数据</div>' : this.items.map(it => {
                    const dm = this.defaultDailyMax;
                    return `<div class="row-item" data-userid="${it.userid}">
                        <input class="form-check-input" type="checkbox">
                        <div class="name-col">
                            <div class="name">${it.name}</div>
                            <div class="uid">${it.userid}</div>
                        </div>
                        <div class="limit-col">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text" style="font-size:11px;">日限</span>
                                <input type="number" class="form-control form-control-sm"
                                    value="${dm}" min="1" max="9999" disabled>
                            </div>
                        </div>
                    </div>`;
                }).join('')}
            </div>`;
        this.bindRowEvents();
    }

    /** CSS 显隐过滤 — 不动 DOM，IME 完全不受影响 */
    applyFilter(filter) {
        const q = filter.toLowerCase().trim();
        const rows = this.el.querySelectorAll('.row-item');
        let visibleCount = 0;
        rows.forEach(row => {
            const name = (row.querySelector('.name')?.textContent || '').toLowerCase();
            const uid = (row.querySelector('.uid')?.textContent || '').toLowerCase();
            const match = !q || name.includes(q) || uid.includes(q);
            row.style.display = match ? '' : 'none';
            if (match) visibleCount++;
        });
        // "无匹配" 提示
        let noResult = this.el.querySelector('.no-result');
        if (visibleCount === 0 && q) {
            if (!noResult) {
                noResult = document.createElement('div');
                noResult.className = 'no-result';
                noResult.textContent = '无匹配员工';
                this.el.querySelector('.list').appendChild(noResult);
            }
        } else if (noResult) {
            noResult.remove();
        }
    }

    /** 更新单行视觉状态（选中/取消时调用，不动其他行） */
    updateRow(userid) {
        const row = this.el.querySelector('.row-item[data-userid="' + userid + '"]');
        if (!row) return;
        const cb = row.querySelector('.form-check-input');
        const limitInput = row.querySelector('.limit-col input');
        const checked = this.selected.has(userid);
        cb.checked = checked;
        if (checked) {
            row.classList.add('selected');
            limitInput.disabled = false;
            limitInput.value = this.selected.get(userid);
        } else {
            row.classList.remove('selected');
            limitInput.disabled = true;
            limitInput.value = this.defaultDailyMax;
        }
        // 更新计数
        const countEl = this.el.querySelector('.count');
        if (countEl) countEl.innerHTML = '已选 <strong>' + this.selected.size + '</strong> / ' + this.items.length + ' 人';
    }

    /** 绑定搜索输入事件 — requestAnimationFrame 合并同帧多次输入 */
    bindEvents() {
        const input = this.el.querySelector('.search-input');
        if (!input) return;
        let scheduled = false;
        input.addEventListener('input', () => {
            if (scheduled) return;       // 同一帧内已有待执行任务，跳过
            scheduled = true;
            requestAnimationFrame(() => {
                scheduled = false;
                this.applyFilter(input.value);
            });
        });
    }

    /** 绑定每行的复选框和日限输入事件（只绑一次，不重复绑） */
    bindRowEvents() {
        const rows = this.el.querySelectorAll('.row-item');
        rows.forEach(row => {
            const userid = row.dataset.userid;
            const cb = row.querySelector('.form-check-input');
            const limitInput = row.querySelector('.limit-col input');

            // 复选框变化
            cb.addEventListener('change', () => {
                if (cb.checked) {
                    this.selected.set(userid, parseInt(limitInput.value) || this.defaultDailyMax);
                } else {
                    this.selected.delete(userid);
                }
                this.updateRow(userid);
            });

            // 点击行切换复选框
            row.addEventListener('click', e => {
                if (e.target.tagName === 'INPUT') return;
                cb.checked = !cb.checked;
                cb.dispatchEvent(new Event('change'));
            });

            // 日限输入变化
            limitInput.addEventListener('change', () => {
                if (this.selected.has(userid)) {
                    this.selected.set(userid, parseInt(limitInput.value) || this.defaultDailyMax);
                }
            });
            limitInput.addEventListener('click', e => e.stopPropagation());
        });
    }

    /** HTML 转义 */
    _escape(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }

    /** 获取选中的员工列表 [{userid, name, dailyMax}] */
    getSelected() {
        const result = [];
        const nameMap = new Map(this.items.map(it => [it.userid, it.name]));
        this.selected.forEach((dailyMax, userid) => {
            result.push({ userid, name: nameMap.get(userid) || userid, dailyMax });
        });
        return result;
    }

    /** 重置为全部未选 */
    reset() {
        this.selected.clear();
        const rows = this.el.querySelectorAll('.row-item');
        rows.forEach(row => {
            const userid = row.dataset.userid;
            this.updateRow(userid);
        });
        const input = this.el.querySelector('.search-input');
        if (input) { input.value = ''; this.applyFilter(''); }
    }
}

/**
 * AutocompleteInput — 输入自动补全下拉组件。
 *
 * 鼠标点击选项或方向键 ↑↓ 导航后回车确认，匹配关键词高亮显示。
 * 也可直接输入下拉列表中不存在的自定义值。
 *
 * 用法: new AutocompleteInput(document.getElementById('wrapperId'), ['选项1', '选项2', ...])
 */
class AutocompleteInput {
    constructor(wrapper, options = [], opts = {}) {
        this.wrapper = wrapper;
        this.input = wrapper.querySelector('input');
        this.options = options;
        this.onSelect = opts.onSelect || null;  // 选中回调(value)
        this.dropdown = null;
        this.activeIdx = -1;
        this.bindEvents();
    }

    /** 显示下拉列表，按关键词过滤 */
    show(q) {
        this.hide();
        const kw = q.toLowerCase().trim();
        // 无关键词时展示前 30 条，有关键词时模糊匹配
        const filtered = kw
            ? this.options.filter(o => o.toLowerCase().includes(kw))
            : this.options.slice(0, 30);
        if (filtered.length === 0) {
            this.dropdown = document.createElement('div');
            this.dropdown.className = 'autocomplete-dropdown';
            this.dropdown.innerHTML = '<div class="autocomplete-empty">无匹配，回车使用输入值</div>';
            this.wrapper.appendChild(this.dropdown);
            return;
        }
        this.dropdown = document.createElement('div');
        this.dropdown.className = 'autocomplete-dropdown';
        this.dropdown.innerHTML = filtered.map(o => {
            const label = kw
                ? this._escapeHtml(o).replace(new RegExp(`(${this._escapeRe(kw)})`, 'gi'), '<mark>$1</mark>')
                : this._escapeHtml(o);
            return `<div class="autocomplete-item" data-value="${this._escapeHtml(o)}">${label}</div>`;
        }).join('');
        this.wrapper.appendChild(this.dropdown);
        this.activeIdx = -1;

        // 鼠标点击选中
        this.dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
            item.addEventListener('mousedown', e => {
                e.preventDefault();
                this.select(item.dataset.value);
            });
        });
    }

    /** 关闭下拉 */
    hide() {
        if (this.dropdown) { this.dropdown.remove(); this.dropdown = null; }
        this.activeIdx = -1;
    }

    /** 选中某值，填入 input 并关闭下拉 */
    select(value) {
        this.input.value = value;
        this.hide();
        if (this.onSelect) this.onSelect(value);
        // 派发 input 事件，方便外部监听值变化
        this.input.dispatchEvent(new Event('input', { bubbles: true }));
    }

    /** 方向键移动高亮 */
    move(delta) {
        if (!this.dropdown) return;
        const items = this.dropdown.querySelectorAll('.autocomplete-item');
        if (items.length === 0) return;
        if (this.activeIdx >= 0) items[this.activeIdx].classList.remove('active');
        this.activeIdx = Math.max(0, Math.min(items.length - 1, this.activeIdx + delta));
        items[this.activeIdx].classList.add('active');
        items[this.activeIdx].scrollIntoView({ block: 'nearest' });
    }

    /** 绑定输入/焦点/键盘事件，兼容中文输入法（IME composition） */
    bindEvents() {
        let composing = false;
        this.input.addEventListener('compositionstart', () => { composing = true; });
        this.input.addEventListener('compositionend', () => {
            composing = false;
            this.show(this.input.value);
        });
        this.input.addEventListener('input', () => {
            if (!composing) this.show(this.input.value);
        });
        this.input.addEventListener('focus', () => this.show(this.input.value));
        // 延迟关闭让 mousedown 先于 blur 触发
        this.input.addEventListener('blur', () => setTimeout(() => this.hide(), 150));
        this.input.addEventListener('keydown', e => {
            if (e.key === 'ArrowDown')      { e.preventDefault(); this.move(1); }
            else if (e.key === 'ArrowUp')   { e.preventDefault(); this.move(-1); }
            else if (e.key === 'Enter')     {
                if (this.dropdown && this.activeIdx >= 0) {
                    e.preventDefault();
                    const items = this.dropdown.querySelectorAll('.autocomplete-item');
                    if (items[this.activeIdx]) this.select(items[this.activeIdx].dataset.value);
                }
            }
            else if (e.key === 'Escape')    { this.hide(); }
        });
    }

    _escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    _escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
}

// ── 页面初始化 ──
document.addEventListener('DOMContentLoaded', () => {
    const employees = window._employeeList || [];

    let svcPicker = null;
    let receptionistPicker = null;

    // 员工选择器初始化（仅在有员工数据时）
    if (employees.length > 0) {
        svcPicker = new EmployeePicker(document.getElementById('svcPicker'), {
            items: employees,
            defaultDailyMax: 150,
            placeholder: '搜索服务老师姓名或账号...'
        });

        receptionistPicker = new EmployeePicker(document.getElementById('receptionistPicker'), {
            items: employees,
            defaultDailyMax: 150,
            placeholder: '搜索后备接待员姓名或账号...'
        });

        // 表单提交：先序列化员工数据，再 AJAX 提交，失败时留在页面显示错误
        document.getElementById('createForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // 1. 序列化员工选择到隐藏字段
            const svc = svcPicker.getSelected();
            document.getElementById('svcJson').value = svc.length > 0 ? JSON.stringify(svc) : '';
            document.getElementById('svcFallback').value = svc.map(s => s.userid).join(',');
            const receptionist = receptionistPicker.getSelected();
            document.getElementById('receptionistJson').value = receptionist.length > 0
                ? JSON.stringify(receptionist) : '';

            // 2. 客户端必填校验
            const errEl = document.getElementById('createError');
            const form = this;
            const schoolName = form.querySelector('[name="schoolName"]').value.trim();
            const city = form.querySelector('[name="regionCity"]').value.trim();
            const district = form.querySelector('[name="regionDistrict"]').value.trim();

            if (!schoolName) {
                errEl.textContent = '请填写学校名称';
                errEl.classList.remove('d-none');
                form.querySelector('[name="schoolName"]').focus();
                return;
            }
            if (!city) {
                errEl.textContent = '请填写市州';
                errEl.classList.remove('d-none');
                form.querySelector('[name="regionCity"]').focus();
                return;
            }
            if (!district) {
                errEl.textContent = '请填写县区';
                errEl.classList.remove('d-none');
                form.querySelector('[name="regionDistrict"]').focus();
                return;
            }
            if (svc.length === 0) {
                errEl.textContent = '请至少选择一位服务老师';
                errEl.classList.remove('d-none');
                return;
            }

            // 隐藏之前的错误
            errEl.classList.add('d-none');

            // 3. 禁用提交按钮防重复点击
            const submitBtn = form.querySelector('button[type="submit"]');
            const origText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ 创建中...';

            // 4. AJAX 提交
            const formData = new FormData(form);
            fetch(form.action, {
                method: 'POST',
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                body: formData
            })
            .then(async resp => {
                const data = await resp.json();
                if (!resp.ok || !data.success) {
                    throw new Error(data.error || '创建失败，请重试');
                }
                // 成功 → 跳转到活码列表
                window.location.href = '/qrcodes';
            })
            .catch(err => {
                errEl.textContent = '创建失败：' + err.message;
                errEl.classList.remove('d-none');
                errEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = origText;
            });
        });
    }

    // ── 学校ID自动生成 ──
    const schoolIdInput = document.getElementById('schoolIdInput');
    document.getElementById('regenerateSchoolIdBtn').addEventListener('click', () => {
        const now = new Date();
        const pad = (n, len) => String(n).padStart(len, '0');
        const ts = now.getFullYear()
            + pad(now.getMonth() + 1, 2)
            + pad(now.getDate(), 2)
            + pad(now.getHours(), 2)
            + pad(now.getMinutes(), 2)
            + pad(now.getSeconds(), 2);
        // 加两位随机数防止同一秒内重复
        const rnd = Math.floor(Math.random() * 100);
        schoolIdInput.value = 'SCH' + ts + pad(rnd, 2);
    });

    // ── 自动补全下拉初始化 ──
    new AutocompleteInput(document.getElementById('schoolAcWrapper'), window._schoolOptions || []);
    new AutocompleteInput(document.getElementById('cityAcWrapper'), window._cityOptions || []);
    new AutocompleteInput(document.getElementById('districtAcWrapper'), window._districtOptions || []);

    // ── 部门可搜索下拉（选中时同步隐藏域 departmentId）──
    const deptNames = window._departmentNames || [];
    const deptMap = window._departmentMap || {};
    new AutocompleteInput(document.getElementById('deptAcWrapper'), deptNames, {
        onSelect: function(name) {
            const id = deptMap[name];
            document.getElementById('departmentId').value = id !== undefined ? id : '';
        }
    });
    // 手动输入/清空时同步清除隐藏域（用户可能直接输入不存在的部门名）
    document.getElementById('deptAcInput').addEventListener('input', function() {
        const val = this.value.trim();
        const id = deptMap[val];
        document.getElementById('departmentId').value = id !== undefined ? id : '';
    });

    // ── 学校人数 → 自动计算接待员数预览 ──
    const studentCountInput = document.getElementById('studentCountInput');
    const previewEl = document.getElementById('agentCountPreview');
    studentCountInput.addEventListener('input', () => {
        const count = parseInt(studentCountInput.value);
        if (count && count > 0) {
            const need = Math.max(1, Math.min(100, Math.ceil(count / 100)));
            const svcSelected = svcPicker ? svcPicker.getSelected().length : 0;
            const fromPool = Math.max(0, need - svcSelected);
            previewEl.style.display = '';
            previewEl.innerHTML = '预计需要 <strong>' + need + '</strong> 个接待员'
                + (svcSelected > 0 ? '（含 ' + svcSelected + ' 位服务老师，从全局池补 <strong>' + fromPool + '</strong> 人）' : '');
        } else {
            previewEl.style.display = 'none';
        }
    });
});

    // 场景配置（由后端 Thymeleaf 渲染）
    const SCENE_CONFIG = {
        daily_push: {
            scanRatio: /*[[${sceneConfig.dailyPush.scanRatio}]]*/ 0.20,
            urgentRatio: /*[[${sceneConfig.dailyPush.urgentRatio}]]*/ 95
        },
        parent_meeting: {
            scanRatio: /*[[${sceneConfig.parentMeeting.scanRatio}]]*/ 0.75,
            urgentRatio: /*[[${sceneConfig.parentMeeting.urgentRatio}]]*/ 70
        }
    };
    const DAILY_MAX = /*[[${dailyMaxDefault} ?: 150]]*/ 150;

    function onSceneChange() {
        const checkedRadio = document.querySelector('input[name="scene"]:checked');
        if (!checkedRadio) return;
        const scene = checkedRadio.value;
        const cfg = SCENE_CONFIG[scene];
        if (!cfg) return;
        const studentInput = document.getElementById('studentCountInput');
        const studentCount = parseInt(studentInput?.value) || 0;
        const countInput = document.getElementById('initialAgentCount');
        const estimateSpan = document.getElementById('agentEstimate');
        const formulaSpan = document.getElementById('agentEstimateFormula');

        if (studentCount > 0) {
            const expectedScans = Math.ceil(studentCount * cfg.scanRatio);
            const need = Math.max(1, Math.min(100,
                Math.ceil(expectedScans / DAILY_MAX)));
            estimateSpan.textContent = '预估 ' + need + ' 人';
            formulaSpan.textContent =
                '公式: ceil(' + studentCount + ' × ' + Math.round(cfg.scanRatio * 100) + '% / ' + DAILY_MAX + ')'
                + ' = ceil(' + expectedScans + ' / ' + DAILY_MAX + ') = ' + need + ' 人';
            if (!countInput.value) countInput.placeholder = need;
        } else {
            estimateSpan.textContent = '—';
            formulaSpan.textContent = '';
        }
    }

    document.getElementById('studentCountInput')?.addEventListener('input', onSceneChange);
    document.addEventListener('DOMContentLoaded', onSceneChange);
</script>
</main>
</html>
