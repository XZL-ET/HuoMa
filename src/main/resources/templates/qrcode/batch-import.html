<!DOCTYPE html>
<!-- 批量导入活码页面 — 通过 Excel 文件批量创建活码，支持异步进度展示 -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='批量导入活码', content=~{::main})}">
<main>
    <div class="card p-4 mx-auto" style="max-width: 700px;">
        <h5 class="mb-3">批量导入活码</h5>
        <!-- Excel 格式说明 -->
        <div class="alert alert-info">
            <strong>Excel 格式要求（14列）：</strong><br>
            第1行表头：学校名称* | 学校ID | 市* | 区* | 服务老师* | 学校人数 | 初始上码员工数 | 接待员 | 服务老师日上限 | 欢迎语 | 备注 | 场景 | 部门ID/名称 | 分类名称<br>
            第2行起数据行，*为必填列，学校ID留空自动生成，初始上码员工数填了学校人数会自动计算，服务老师日上限默认200，场景不填默认为daily_push<br>
            服务老师支持中文姓名（自动转userid）或直接填userid，接待员可选
        </div>

        <!-- 模板下载 + 上传表单 -->
        <div class="mb-3" th:if="${taskId == null}">
            <a href="/qrcodes/batch-import/template" class="btn btn-outline-info mb-2"><i class="bi bi-download"></i> 下载模板</a>
        </div>

        <form method="post" th:action="@{/qrcodes/batch-import}" enctype="multipart/form-data"
              th:if="${taskId == null}">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
            <div class="mb-3">
                <label class="form-label">选择 Excel 文件 (.xlsx)</label>
                <input type="file" name="file" class="form-control" accept=".xlsx" required>
            </div>
            <button type="submit" class="btn btn-primary">📤 开始导入</button>
            <a href="/qrcodes" class="btn btn-outline-secondary">返回列表</a>
        </form>

        <!-- 进度条区域：th:if="${taskId != null}" 表示有任务进行中时显示实时进度 -->
        <div th:if="${taskId != null}" id="progressSection">
            <h6>导入进行中...</h6>
            <div class="progress mb-3" style="height: 25px;">
                <!-- 进度条，由 JS 动态更新宽度和百分比 -->
                <div class="progress-bar progress-bar-striped progress-bar-animated"
                     id="progressBar" role="progressbar" style="width: 0%;">0%</div>
            </div>
            <!-- 统计信息：总计/已处理/成功/失败 -->
            <div id="progressStats" class="text-muted small mb-3">
                正在处理...
            </div>
            <!-- 失败详情（预留，暂未实现） -->
            <div id="failDetails" class="mt-3"></div>
            <!-- 导入完成后的操作按钮 -->
            <div id="doneActions" class="mt-3" style="display:none;">
                <a href="/qrcodes" class="btn btn-primary">返回活码列表</a>
            </div>
        </div>
    </div>

    <!-- 进度轮询脚本，仅在有任务时加载 -->
    <script th:if="${taskId != null}" th:inline="javascript">
        /* 从 Thymeleaf 模板中获取 taskId */
        const taskId = /*[[ ${taskId} ]]*/ '';
        let pollTimer;

        /* 轮询后端获取导入进度 */
        function pollProgress() {
            fetch('/qrcodes/batch-import/progress/' + taskId)
                .then(r => r.json())
                .then(data => {
                    if (!data || Object.keys(data).length === 0) return;

                    const total = parseInt(data.total) || 0;
                    const success = parseInt(data.success) || 0;
                    const fail = parseInt(data.fail) || 0;
                    const processed = parseInt(data.processed) || 0;
                    const status = data.status || 'processing';
                    const error = data.error || '';
                    const failDetails = data.failDetails || [];

                    /* 显示错误状态 */
                    if (status === 'error') {
                        clearInterval(pollTimer);
                        const bar = document.getElementById('progressBar');
                        bar.style.width = '100%';
                        bar.textContent = '失败';
                        bar.className = 'progress-bar bg-danger';
                        document.getElementById('progressStats').innerHTML =
                            '<span class="text-danger">错误：' + escHtml(error) + '</span>';
                        document.getElementById('doneActions').style.display = 'block';
                        renderFailDetails(failDetails);
                        return;
                    }

                    /* 计算并更新进度条百分比 */
                    const percent = total > 0 ? Math.round((processed / total) * 100) : 0;
                    const bar = document.getElementById('progressBar');
                    bar.style.width = percent + '%';
                    bar.textContent = percent + '%';
                    bar.className = 'progress-bar progress-bar-striped' +
                        (status === 'done' ? '' : ' progress-bar-animated') +
                        (status === 'done' ? (fail > 0 ? ' bg-warning' : ' bg-success') : '');

                    /* 更新统计文本 + 阶段描述 */
                    const msg = data.message || '';
                    const skipped = parseInt(data.skipped) || 0;
                    let statsHtml = '<div>总计 ' + total + ' | 已处理 ' + processed +
                        ' | 成功 ' + success + ' | 失败 ' + fail;
                    if (skipped > 0) statsHtml += ' | <span class="text-muted">跳过 ' + skipped + '</span>';
                    statsHtml += '</div>';
                    if (msg) statsHtml += '<div class="text-muted small mt-1">' + escHtml(msg) + '</div>';
                    document.getElementById('progressStats').innerHTML = statsHtml;

                    /* 导入完成时停止轮询，显示完成后的操作按钮和失败详情 */
                    if (status === 'done' || status === 'interrupted') {
                        clearInterval(pollTimer);
                        document.getElementById('doneActions').style.display = 'block';
                        if (status === 'interrupted') {
                            document.getElementById('progressStats').textContent += ' ⚠ 导入被中断';
                            bar.className = 'progress-bar bg-warning';
                        }
                        renderFailDetails(failDetails);
                    }
                })
                .catch(() => clearInterval(pollTimer));
        }

        /* 渲染失败详情列表 */
        function renderFailDetails(details) {
            const container = document.getElementById('failDetails');
            if (!details || details.length === 0) {
                container.innerHTML = '';
                return;
            }
            let html = '<div class="alert alert-warning mt-3"><strong>⚠ 失败详情（' + details.length + '条）：</strong>';
            html += '<ul class="mb-0 mt-1" style="max-height:300px;overflow-y:auto;">';
            for (const d of details) {
                // 格式: 行号|学校名称|失败原因
                const parts = d.split('|');
                const row = escHtml(parts[0] || '?');
                const name = escHtml(parts[1] || '?');
                const reason = escHtml(parts.slice(2).join('|') || '未知错误');
                html += '<li class="small"><b>第' + row + '行</b> ' + name + '：' + reason + '</li>';
            }
            html += '</ul></div>';
            container.innerHTML = html;
        }

        function escHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /* 每 500ms 轮询一次进度 */
        pollTimer = setInterval(pollProgress, 500);
        pollProgress(); // 立即执行一次
    </script>
</main>
</html>
