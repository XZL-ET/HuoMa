<!DOCTYPE html>
<!-- 批量导入活码页面 — 通过 Excel 文件批量创建活码，支持异步进度展示 -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='批量导入活码', content=~{::main})}">
<main>
    <div class="card p-4 mx-auto" style="max-width: 700px;">
        <h5 class="mb-3">批量导入活码</h5>
        <!-- Excel 格式说明 -->
        <div class="alert alert-info">
            <strong>Excel 格式要求：</strong><br>
            第1行：表头（学校名称 / 学校ID / 市 / 区 / 备注）<br>
            第2行起：数据行，每行一个学校
        </div>

        <!-- 上传表单：th:if="${taskId == null}" 表示当前没有正在执行的任务时才显示 -->
        <form method="post" th:action="@{/qrcodes/batch-import}" enctype="multipart/form-data"
              th:if="${taskId == null}">
            <div class="mb-3">
                <label class="form-label">选择 Excel 文件 (.xlsx)</label>
                <input type="file" name="file" class="form-control" accept=".xlsx" required>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-upload"></i> 开始导入</button>
            <a href="/qrcodes" class="btn btn-outline-secondary">返回列表</a>
        </form>

        <!-- 进度条区域：th:if="${taskId != null}" 表示有任务进行中时显示实时进度 -->
        <div th:if="${taskId != null}" id="progressSection">
            <h6>导入进行中...</h6>
            <div class="progress mb-3" style="height: 25px;">
                <!-- 进度条，由 JS 动态更新宽度和百分比 -->
                <div class="progress-bar progress-bar-striped progress-bar-animated"
                     id="progressBar" role="progressbar" style="width: 0%;">0%</div>
            </div>
            <!-- 统计信息：总计/已处理/成功/失败 -->
            <div id="progressStats" class="text-muted small mb-3">
                正在处理...
            </div>
            <!-- 失败详情（预留，暂未实现） -->
            <div id="failDetails" class="mt-3"></div>
            <!-- 导入完成后的操作按钮 -->
            <div id="doneActions" class="mt-3" style="display:none;">
                <a href="/qrcodes" class="btn btn-primary">返回活码列表</a>
            </div>
        </div>
    </div>

    <!-- 进度轮询脚本，仅在有任务时加载 -->
    <script th:if="${taskId != null}" th:inline="javascript">
        /* 从 Thymeleaf 模板中获取 taskId */
        const taskId = /*[[ ${taskId} ]]*/ '';
        let pollTimer;

        /* 轮询后端获取导入进度 */
        function pollProgress() {
            fetch('/qrcodes/batch-import/progress/' + taskId)
                .then(r => r.json())
                .then(data => {
                    if (!data || Object.keys(data).length === 0) return;

                    const total = parseInt(data.total) || 0;
                    const success = parseInt(data.success) || 0;
                    const fail = parseInt(data.fail) || 0;
                    const processed = parseInt(data.processed) || 0;
                    const status = data.status || 'processing';

                    /* 计算并更新进度条百分比 */
                    const percent = total > 0 ? Math.round((processed / total) * 100) : 0;
                    const bar = document.getElementById('progressBar');
                    bar.style.width = percent + '%';
                    bar.textContent = percent + '%';
                    bar.className = 'progress-bar progress-bar-striped' +
                        (status === 'done' ? '' : ' progress-bar-animated') +
                        (status === 'done' ? (fail > 0 ? ' bg-warning' : ' bg-success') : '');

                    /* 更新统计文本 */
                    document.getElementById('progressStats').textContent =
                        '总计 ' + total + ' | 已处理 ' + processed +
                        ' | 成功 ' + success + ' | 失败 ' + fail;

                    /* 导入完成时停止轮询，显示完成后的操作按钮 */
                    if (status === 'done') {
                        clearInterval(pollTimer);
                        document.getElementById('doneActions').style.display = 'block';
                    }
                })
                .catch(() => clearInterval(pollTimer));
        }

        /* 每 500ms 轮询一次进度 */
        pollTimer = setInterval(pollProgress, 500);
        pollProgress(); // 立即执行一次
    </script>
</main>
</html>
