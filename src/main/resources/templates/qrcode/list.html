<!DOCTYPE html>
<!-- 活码管理页面 — 展示所有活码列表，支持搜索筛选、批量操作和分页 -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='活码管理', content=~{::main})}">
<main>
    <!-- 页面标题与创建入口 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">
            活码管理
            <small class="text-muted fs-6 ms-2" th:text="'共 ' + ${qrCodes.totalElements} + ' 条'">共 0 条</small>
        </h4>
        <div class="btn-group">
            <a href="/qrcodes/create" class="btn btn-primary"><i class="bi bi-plus-lg"></i> 手动创建</a>
            <a href="/qrcodes/batch-import" class="btn btn-outline-primary"><i class="bi bi-upload"></i> 批量导入</a>
        </div>
    </div>

    <!-- 搜索筛选栏 -->
    <div class="card p-3 mb-3">
        <form class="row g-2" method="get" th:action="@{/qrcodes}">
            <!-- 关键词搜索：学校名称或 ID -->
            <div class="col-md-3">
                <input type="text" name="keyword" class="form-control" placeholder="搜索学校名/ID"
                       th:value="${keyword}">
            </div>
            <!-- 城市筛选下拉框，th:each 遍历 cities 列表生成选项 -->
            <div class="col-md-2">
                <select name="city" class="form-select">
                    <option value="">全部城市</option>
                    <option th:each="c : ${cities}" th:value="${c}"
                            th:text="${c}" th:selected="${city == c}"></option>
                </select>
            </div>
            <!-- 区县筛选下拉框 -->
            <div class="col-md-2">
                <select name="district" class="form-select">
                    <option value="">全部区县</option>
                    <option th:each="d : ${districts}" th:value="${d}"
                            th:text="${d}" th:selected="${district == d}"></option>
                </select>
            </div>
            <!-- 状态筛选：正常/暂停/满员/无可用 -->
            <div class="col-md-2">
                <select name="status" class="form-select">
                    <option value="">全部状态</option>
                    <option value="active" th:selected="${status == 'active'}">✅ 正常</option>
                    <option value="paused" th:selected="${status == 'paused'}">⏸ 暂停</option>
                    <option value="full" th:selected="${status == 'full'}">🔴 满员</option>
                    <option value="no_agent" th:selected="${status == 'no_agent'}">⚫ 无可用</option>
                </select>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-outline-secondary w-100"><i class="bi bi-search"></i></button>
            </div>
        </form>
    </div>

    <!-- 数据表格 -->
    <div class="card p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <!-- 表头 -->
                <thead class="table-light">
                    <tr>
                        <th style="width:36px;"><input type="checkbox" id="selectAll" onchange="toggleAll(this)" title="全选"></th>
                        <th>学校名称</th>
                        <th>城市</th>
                        <th>区县</th>
                        <th>值守/后备</th>
                        <th>今日新增</th>
                        <th>轮换模式</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <!-- 表体：th:each 遍历分页数据 qrCodes.content，每行一个活码 -->
                <tbody>
                    <tr th:each="qr : ${qrCodes.content}">
                        <td><input type="checkbox" name="ids" th:value="${qr.id}" class="qr-checkbox"></td>
                        <td>
                            <!-- 点击学校名称跳转活码详情页 -->
                            <a th:href="@{/qrcodes/{id}(id=${qr.id})}" th:text="${qr.schoolName}"
                               class="text-decoration-none fw-semibold">学校名</a>
                        </td>
                        <td th:text="${qr.regionCity}"></td>
                        <td th:text="${qr.regionDistrict}"></td>
                        <!-- 员工数量（服务老师 + 已激活接待员），通过 agentCountMap 映射 -->
                        <td>
                            <span class="badge bg-info" th:text="${agentCountMap.getOrDefault(qr.id, '-')}">-</span>
                        </td>
                        <!-- 今日新增客户数 -->
                        <td>
                            <span class="fw-semibold" th:text="${todayCountMap.getOrDefault(qr.id, 0)}">0</span>
                        </td>
                        <!-- 轮换模式徽标：自动=绿色，人工=黄色 -->
                        <td>
                            <span class="badge"
                                  th:classappend="${qr.rotateMode.name() == 'auto' ? 'bg-success' : 'bg-warning text-dark'}"
                                  th:text="${qr.rotateMode.name() == 'auto' ? '自动' : '人工'}"></span>
                        </td>
                        <!-- 状态徽标，使用 th:switch 根据枚举值显示不同颜色 -->
                        <td>
                            <span class="badge"
                                  th:classappend="${qr.status.name() == 'active' ? 'bg-success' : (qr.status.name() == 'full' ? 'bg-danger' : 'bg-secondary')}"
                                  th:switch="${qr.status.name()}">
                                <span th:case="'active'">正常</span>
                                <span th:case="'paused'">暂停</span>
                                <span th:case="'full'">满员</span>
                                <span th:case="'no_agent'">无可用</span>
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/qrcodes/{id}(id=${qr.id})}"
                               class="btn btn-sm btn-outline-secondary">详情</a>
                        </td>
                    </tr>
                    <!-- 空数据提示 -->
                    <tr th:if="${qrCodes.content.isEmpty()}">
                        <td colspan="9" class="text-center text-muted py-4">
                            暂无活码数据，点击"手动创建"或"批量导入"开始
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 批量操作按钮组，仅在有数据时显示 -->
    <div class="d-flex gap-2 mt-2" th:if="${!qrCodes.content.isEmpty()}">
        <!-- 批量切换为自动轮换 -->
        <form method="post" th:action="@{/qrcodes/batch-rotate-mode}" id="batchAutoForm">
            <input type="hidden" name="mode" value="auto">
            <div id="batchAutoIds"></div>
        </form>
        <button class="btn btn-sm btn-outline-success" onclick="batchSubmit('auto')">📋 批量切换为自动</button>

        <!-- 批量切换为人工轮换 -->
        <form method="post" th:action="@{/qrcodes/batch-rotate-mode}" id="batchManualForm">
            <input type="hidden" name="mode" value="manual">
            <div id="batchManualIds"></div>
        </form>
        <button class="btn btn-sm btn-outline-warning" onclick="batchSubmit('manual')">📋 批量切换为人工</button>

        <!-- 批量下载 72dpi 二维码（适用于线上使用） -->
        <form method="post" th:action="@{/qrcodes/batch-download}" id="batchDownload72Form">
            <input type="hidden" name="dpi" value="72">
            <div id="batchDownload72Ids"></div>
        </form>
        <button class="btn btn-sm btn-outline-primary" onclick="batchDownload(72)">📥 批量下载 72dpi</button>

        <!-- 批量下载 300dpi 二维码（适用于打印） -->
        <form method="post" th:action="@{/qrcodes/batch-download}" id="batchDownload300Form">
            <input type="hidden" name="dpi" value="300">
            <div id="batchDownload300Ids"></div>
        </form>
        <button class="btn btn-sm btn-outline-secondary" onclick="batchDownload(300)">🖨️ 批量下载 300dpi</button>
    </div>

    <!-- 分页导航，仅当总页数大于 1 时显示 -->
    <nav th:if="${qrCodes.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <!-- 上一页按钮，首页时禁用 -->
            <li class="page-item" th:classappend="${qrCodes.first ? 'disabled' : ''}">
                <a class="page-link"
                   th:href="@{/qrcodes(keyword=${keyword},city=${city},district=${district},status=${status},page=${qrCodes.number - 1})}">上一页</a>
            </li>
            <!-- 页码信息 -->
            <li class="page-item disabled">
                <span class="page-link" th:text="'第 ' + ${qrCodes.number + 1} + ' / ' + ${qrCodes.totalPages} + ' 页'"></span>
            </li>
            <!-- 下一页按钮，末页时禁用 -->
            <li class="page-item" th:classappend="${qrCodes.last ? 'disabled' : ''}">
                <a class="page-link"
                   th:href="@{/qrcodes(keyword=${keyword},city=${city},district=${district},status=${status},page=${qrCodes.number + 1})}">下一页</a>
            </li>
        </ul>
    </nav>

    <!-- 批量操作的 JavaScript 逻辑 -->
    <script>
        /* 全选/取消全选 */
        function toggleAll(source) {
            document.querySelectorAll('.qr-checkbox').forEach(cb => cb.checked = source.checked);
        }

        /* 批量切换轮换模式：将选中的活码 ID 填入对应表单并提交 */
        function batchSubmit(mode) {
            const checked = document.querySelectorAll('.qr-checkbox:checked');
            if (checked.length === 0) {
                alert('请先勾选要操作的活码');
                return;
            }
            const formId = mode === 'auto' ? 'batchAutoForm' : 'batchManualForm';
            const idsDiv = document.getElementById(mode === 'auto' ? 'batchAutoIds' : 'batchManualIds');
            idsDiv.innerHTML = '';
            checked.forEach(cb => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'ids';
                input.value = cb.value;
                idsDiv.appendChild(input);
            });
            document.getElementById(formId).submit();
        }

        /* 批量下载二维码：将选中的活码 ID 填入对应表单并提交 */
        function batchDownload(dpi) {
            const checked = document.querySelectorAll('.qr-checkbox:checked');
            if (checked.length === 0) {
                alert('请先勾选要下载的活码');
                return;
            }
            const formId = dpi === 300 ? 'batchDownload300Form' : 'batchDownload72Form';
            const idsDiv = document.getElementById(dpi === 300 ? 'batchDownload300Ids' : 'batchDownload72Ids');
            idsDiv.innerHTML = '';
            checked.forEach(cb => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'ids';
                input.value = cb.value;
                idsDiv.appendChild(input);
            });
            document.getElementById(formId).submit();
        }
    </script>
</main>
</html>
