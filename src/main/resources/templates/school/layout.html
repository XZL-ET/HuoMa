<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <title>中小学教材发行服务平台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" th:href="@{/css/school-entry.css}" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="school-body">
    <header class="school-topbar">
        <div class="school-topbar-brand">中小学教材发行服务平台</div>
    </header>
    <main class="school-main" id="school-main" hx-target="#school-main" hx-swap="innerHTML">
        <th:block th:insert="${contentTemplate} ?: ~{}" />
    </main>
    <footer style="text-align:center; padding:24px 16px; color:#999; font-size:0.75rem; line-height:1.8;">
        甘肃省新华书店有限责任公司 · 教材发行服务<br>
        官网：<a href="https://www.gsxhsd.com" target="_blank" rel="noopener" style="color:#2980b9;text-decoration:none;">www.gsxhsd.com</a><br>
        如有疑问请联系各区县新华书店<br>
        <a href="http://www.beian.gov.cn/" target="_blank" rel="noopener" style="color:#bbb;text-decoration:none;">联网备案号 62010502001634</a> 丨 <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:#bbb;text-decoration:none;">工信部备案号 陇ICP备20001858号-1</a><br>
        Copyright © 2025 甘肃省新华书店
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        // 微信内置浏览器检测
        (function() {
            var isWechat = /MicroMessenger/i.test(navigator.userAgent);
            document.body.classList.toggle('is-wechat', isWechat);
        })();
    </script>
</body>
</html>
