<!DOCTYPE html>
<!-- 登录页面 — 独立页面，不使用 layout 布局（导航栏指向受保护页面） -->
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — Tom书店 · 活码管理</title>
    <!-- Bootstrap 5 CDN（与 layout.html 使用相同版本以保持一致风格） -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
        }
        .login-card .card-body { padding: 2.5rem; }
        .login-brand {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0d6efd;
        }
    </style>
</head>
<body>
<div class="login-card card">
    <div class="card-body">
        <div class="login-brand">
            <i class="bi bi-book"></i> Tom书店 · 活码管理
        </div>

        <!-- 登录错误提示（来自 ?error 参数） -->
        <th:block th:if="${loginError}">
            <div class="alert alert-danger text-center py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle"></i>
                <span th:text="${loginError}"></span>
            </div>
        </th:block>

        <!-- 登出成功提示（来自 ?logout 参数） -->
        <th:block th:if="${message}">
            <div class="alert alert-success text-center py-2 small" role="alert">
                <i class="bi bi-check-circle"></i>
                <span th:text="${message}"></span>
            </div>
        </th:block>

        <!-- 登录表单，POST 到 /login（Spring Security 默认处理地址） -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" name="username" id="username"
                       class="form-control" placeholder="请输入用户名"
                       required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" name="password" id="password"
                       class="form-control" placeholder="请输入密码"
                       required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> 登 录
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
