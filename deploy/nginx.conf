# XX书店 · 活码管理平台 Nginx 配置
# 放在 ECS /etc/nginx/conf.d/bookstore-qrcode.conf
# 前置条件：ALB 做 TLS 终结 + 80→443 重定向，ECS 安全组只允许 ALB 安全组入站

# 从 ALB 传来的 X-Forwarded-For 取真实客户端 IP
set_real_ip_from 100.64.0.0/10;
real_ip_header X-Forwarded-For;

upstream bookstore_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name huoma.gsxhsd.com;

    # 上传大小限制
    client_max_body_size 10m;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdn.bootcdn.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; frame-src 'none';" always;

    # 禁止外部直接访问 Actuator
    location /actuator {
        allow 127.0.0.1;
        allow 100.64.0.0/10;
        deny all;
        proxy_pass http://bookstore_backend;
    }

    # ALB 健康检查
    location = /health {
        proxy_pass http://bookstore_backend/actuator/health;
        access_log off;
    }

    # 企微回调 — 不需要 buffering，快速响应
    location /api/wecom/callback {
        proxy_pass http://bookstore_backend;
        proxy_buffering off;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 管理后台
    location / {
        proxy_pass http://bookstore_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|ico)$ {
        proxy_pass http://bookstore_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
