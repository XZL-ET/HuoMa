# XX书店 · 活码管理平台 Nginx 配置
# 放在腾讯云 ECS /etc/nginx/conf.d/bookstore-qrcode.conf

upstream bookstore_backend {
    server 127.0.0.1:8080;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # 企微回调 — 不需要 buffering，快速响应
    location /api/wecom/callback {
        proxy_pass http://bookstore_backend;
        proxy_buffering off;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 管理后台
    location / {
        proxy_pass http://bookstore_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|ico)$ {
        proxy_pass http://bookstore_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
